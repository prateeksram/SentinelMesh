<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture Football — Stadium</title>
<style>
  :root{--night:#0B1D2A;--ink:#07131C;--chalk:#F4F7F1;--mut:#9db4c6;
        --amber:#FFC400;--cyan:#3EC7F4;--red:#FF4438;--green:#3ddc74;
        --fBlack:'Arial Black','Archivo Black',Impact,'Segoe UI Black',system-ui,sans-serif;
        --fCond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
        --fBody:Barlow,'Segoe UI',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#04070d;color:var(--chalk);font-family:var(--fBody);
       overflow:hidden;user-select:none}

  /* ---------------- full-bleed stadium canvas ---------------- */
  #pitch{position:fixed;inset:0;width:100vw;height:100vh;display:block}

  /* ---------------- broadcast bug ---------------- */
  .livebug{position:fixed;top:14px;left:16px;z-index:6;display:flex;align-items:center;gap:9px;
           font-family:var(--fCond);font-weight:700;letter-spacing:2.5px;font-size:13px;
           background:linear-gradient(180deg,rgba(10,20,30,.85),rgba(5,11,18,.88));
           border:1px solid rgba(158,190,215,.28);border-left:4px solid var(--red);
           padding:7px 14px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .livebug .reddot{width:8px;height:8px;border-radius:50%;background:var(--red);
                   box-shadow:0 0 8px var(--red);animation:blink 1.1s infinite}
  .livebug em{font-style:normal;color:var(--mut);margin-left:2px}

  /* ---------------- scorebug ---------------- */
  .board{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:6;
         display:flex;align-items:stretch;filter:drop-shadow(0 10px 26px rgba(0,0,0,.6))}
  .team{display:flex;align-items:center;gap:12px;
        background:linear-gradient(180deg,rgba(19,38,56,.92),rgba(8,20,32,.94));
        border:1px solid #27455d;padding:8px 16px;min-width:252px}
  .team.you{border-radius:12px 0 0 12px;border-right:none;box-shadow:inset 0 -3px 0 var(--amber)}
  .team.right{flex-direction:row-reverse}
  .team.wall{border-radius:0 12px 12px 0;border-left:none;box-shadow:inset 0 -3px 0 var(--cyan)}
  .tname{font-family:var(--fBlack);font-size:17px;letter-spacing:1px}
  .tname small{display:block;font-family:var(--fCond);font-weight:700;
               letter-spacing:2px;font-size:11px;color:var(--mut)}
  .score{font-family:var(--fBlack);font-size:38px;line-height:1;color:var(--amber);
         min-width:46px;text-align:center;text-shadow:0 0 18px rgba(255,196,0,.35)}
  .team.right .score{color:var(--cyan);text-shadow:0 0 18px rgba(62,199,244,.35)}
  .dots{display:flex;gap:5px}
  .dot{width:12px;height:12px;border-radius:50%;border:2px solid #33526b;background:rgba(10,22,34,.6)}
  .dot.goal{background:var(--green);border-color:var(--green);box-shadow:0 0 7px rgba(61,220,116,.7)}
  .dot.save{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 7px rgba(62,199,244,.7)}
  .dot.post{background:var(--amber);border-color:var(--amber);box-shadow:0 0 7px rgba(255,196,0,.7)}
  .dot.over{background:var(--red);border-color:var(--red);box-shadow:0 0 7px rgba(255,68,56,.7)}
  .dot.now{border-color:var(--chalk);box-shadow:0 0 9px rgba(244,247,241,.85)}
  .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:linear-gradient(180deg,rgba(6,13,20,.95),rgba(4,9,15,.95));
       border-top:1px solid #27455d;border-bottom:1px solid #27455d;
       font-family:var(--fCond);font-weight:700;letter-spacing:2px;
       color:var(--mut);font-size:12px;min-width:118px;text-align:center;padding:4px 14px}
  .mid b{color:var(--chalk);font-size:16px;letter-spacing:3px}

  /* ---------------- centre overlay ---------------- */
  .stage{position:fixed;inset:0;z-index:4;pointer-events:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;
           padding:0 4vw;transform:translateY(10vh)}
  #big{font-family:var(--fBlack);font-size:clamp(42px,8.6vw,124px);line-height:.95;letter-spacing:1px;
       color:#fff;
       text-shadow:0 3px 0 rgba(0,0,0,.4),0 12px 46px rgba(0,0,0,.8),0 0 90px rgba(62,199,244,.22);
       transition:transform .12s}
  #big.goal{color:var(--amber);
       text-shadow:0 3px 0 rgba(90,60,0,.5),0 12px 46px rgba(0,0,0,.8),0 0 110px rgba(255,196,0,.5)}
  #big.save{color:var(--cyan);
       text-shadow:0 3px 0 rgba(0,50,70,.5),0 12px 46px rgba(0,0,0,.8),0 0 110px rgba(62,199,244,.5)}
  #big.warn{color:var(--red);
       text-shadow:0 3px 0 rgba(70,10,0,.5),0 12px 46px rgba(0,0,0,.8),0 0 110px rgba(255,68,56,.45)}
  #big.pop{transform:scale(1.12)}
  #sub{margin-top:14px;font-family:var(--fCond);font-weight:700;letter-spacing:2px;
       font-size:clamp(14px,2vw,22px);color:#e8f0f6;max-width:80vw;
       background:linear-gradient(180deg,rgba(8,16,25,.72),rgba(5,11,18,.78));
       border:1px solid rgba(158,190,215,.25);border-radius:999px;padding:9px 22px;
       box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #sub:empty{display:none}
  #startBtn{pointer-events:auto;margin-top:28px;font-family:var(--fBlack);
            font-size:clamp(20px,3vw,30px);letter-spacing:2px;color:var(--ink);
            background:linear-gradient(180deg,#ffd54d,var(--amber));
            border:none;border-radius:14px;padding:16px 46px;cursor:pointer;
            box-shadow:0 8px 0 #b98d00,0 16px 40px rgba(0,0,0,.5);
            transition:transform .08s,box-shadow .08s}
  #startBtn:active{transform:translateY(6px);box-shadow:0 2px 0 #b98d00,0 8px 24px rgba(0,0,0,.5)}
  #startBtn:disabled{background:#31506a;color:#7d95a8;box-shadow:0 8px 0 #22374a;cursor:default}
  #startBtn.hide{display:none}
  #abortBtn{font:inherit;color:var(--chalk);background:#5a2230;border:1px solid #8a3040;
            border-radius:8px;padding:5px 10px;cursor:pointer;letter-spacing:1.5px}
  #abortBtn.hide{display:none}
  #abortBtn:hover{background:#7a2a3a}

  /* ---------------- lower-third ticker ---------------- */
  .ticker{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;
          width:min(1280px,95vw);display:flex;align-items:stretch;min-height:54px;
          background:linear-gradient(180deg,rgba(10,20,31,.92),rgba(5,11,18,.94));
          border:1px solid #24445c;border-radius:10px;overflow:hidden;
          box-shadow:0 14px 34px rgba(0,0,0,.55)}
  .desk{display:flex;align-items:center;gap:10px;
        background:linear-gradient(135deg,#ffd54d,var(--amber) 60%,#e5b000);color:var(--ink);
        font-family:var(--fBlack);font-size:14px;letter-spacing:1px;
        padding:0 26px 0 18px;white-space:nowrap;
        clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
  .desk.tmpl{background:linear-gradient(135deg,#3a5c7a,#2a4a66);color:var(--chalk)}
  .desk .pulse{width:10px;height:10px;border-radius:50%;background:var(--ink)}
  .desk.live .pulse{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}
  #line{flex:1;display:flex;align-items:center;padding:8px 18px;font-weight:700;
        font-size:clamp(14px,1.8vw,20px);color:var(--chalk);
        overflow:hidden}
  .links{display:flex;gap:14px;padding:0 16px;font-family:var(--fCond);
         font-weight:700;letter-spacing:1.5px;font-size:13px;color:var(--mut);align-items:center;
         border-left:1px solid #1c374c}
  .led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);
       margin-right:6px;vertical-align:1px;box-shadow:0 0 6px rgba(255,68,56,.8)}
  .led.on{background:var(--green);box-shadow:0 0 6px rgba(61,220,116,.8)}
  #soundBtn{font:inherit;color:var(--chalk);background:#22374a;border:1px solid #31506a;
            border-radius:999px;padding:5px 14px;cursor:pointer;letter-spacing:1.5px}
  #soundBtn.off{color:var(--mut);background:transparent}
  #fxBadge{font:inherit;color:var(--mut);letter-spacing:1.5px;white-space:nowrap}
  #fxBadge.on{color:var(--cyan)}
  #fxBadge.qnn{color:var(--amber)}
</style>
</head>
<body>

<canvas id="pitch" width="1280" height="720"></canvas>

<div class="livebug"><span class="reddot"></span>LIVE<em>PENALTY SHOOTOUT</em></div>

<div class="board">
  <div class="team you">
    <div class="tname">YOU<small>STRIKER</small></div>
    <div class="score" id="sYou">0</div>
    <div class="dots" id="dYou"></div>
  </div>
  <div class="mid"><b id="midTop">LOBBY</b><span id="midBot">GESTURE FOOTBALL</span></div>
  <div class="team right wall">
    <div class="tname">THE&nbsp;WALL<small>AI&nbsp;KEEPER</small></div>
    <div class="score" id="sWall">0</div>
    <div class="dots" id="dWall"></div>
  </div>
</div>

<div class="stage">
  <div class="overlay">
    <div id="big">GESTURE FOOTBALL</div>
    <div id="sub">waiting for the striker…</div>
    <button id="startBtn" disabled>START MATCH</button>
  </div>
</div>

<div class="ticker">
  <div class="desk tmpl" id="desk"><span class="pulse"></span><span id="deskName">TEMPLATE DESK</span></div>
  <div id="line">Open phone.html on your phone, prop it up so it sees your whole body.</div>
  <div class="links">
    <span><span class="led" id="ledP"></span>PHONE</span>
    <span><span class="led on"></span>THE WALL</span>
    <span id="fxBadge" title="On-device stadium neural FX">FX · …</span>
    <button id="soundBtn" title="Speak the keeper's lines">SOUND ON</button>
    <button id="abortBtn" class="hide" title="End the match and return to lobby">END MATCH</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let S=null, prev=null, ws=null;

/* ============================ VFX director ============================ */
const VFX={
  force:0, power:0.5, spin:0, strike:"drive", height:"L", result:null, zone:null,
  kickFlashT:-1e9, shockT:-1e9, washT:-1e9, washColor:"amber",
  bloom:0, chroma:0, intensity:0.5,
};
function vfxTier(force){
  return clamp((Number(force)||0)/380, 0, 1.35);
}
function vfxArmFromLast(last){
  if(!last) return;
  VFX.force=last.force||0;
  VFX.power=last.power??0.5;
  VFX.spin=typeof last.spin==="number"?clamp(last.spin,-1,1)
    :clamp((last.dirDeg||0)/45,-1,1);
  VFX.strike=last.strike==="chip"?"chip":"drive";
  VFX.height=last.height==="H"?"H":"L";
  VFX.result=last.result||null;
  VFX.zone=last.zone||null;
  VFX.intensity=vfxTier(VFX.force);
}
function vfxOnImpact(now, res){
  const I=VFX.intensity;
  VFX.kickFlashT=now;
  VFX.shockT=now;
  VFX.washT=now;
  VFX.washColor=res==="goal"?"amber":res==="save"?"cyan":"white";
  VFX.bloom=0.35+0.65*I;
  VFX.chroma=0.25+0.55*I;
}
function drawPostFX(now){
  // Canvas2D broadcast post pass (Adreno-friendly). WebGPU bloom when available.
  const flashQ=(now-VFX.kickFlashT)/280;
  const shockQ=(now-VFX.shockT)/520;
  const washQ=(now-VFX.washT)/900;
  if(flashQ>=0&&flashQ<1){
    const a=(1-flashQ)*VFX.chroma*0.55;
    cx.save();
    cx.globalCompositeOperation="screen";
    cx.fillStyle=`rgba(255,60,40,${a*0.55})`;
    cx.fillRect(-3,0,W,H);
    cx.fillStyle=`rgba(40,200,255,${a*0.45})`;
    cx.fillRect(3,0,W,H);
    cx.restore();
  }
  if(shockQ>=0&&shockQ<1){
    const R=(0.08+0.55*shockQ)*Math.min(W,H)*(0.7+0.5*VFX.intensity);
    const a=(1-shockQ)*0.55*VFX.intensity;
    cx.save();
    cx.strokeStyle=VFX.washColor==="amber"?`rgba(255,196,0,${a})`
      :VFX.washColor==="cyan"?`rgba(62,199,244,${a})`:`rgba(255,255,255,${a})`;
    cx.lineWidth=Math.max(2, H*0.006*(1-shockQ*0.6));
    cx.beginPath(); cx.arc(W/2, H*0.58, R, 0, 7); cx.stroke();
    cx.restore();
  }
  if(washQ>=0&&washQ<1){
    const a=(1-washQ)*VFX.bloom*0.35;
    const g=cx.createRadialGradient(W/2,H*0.48,Math.min(W,H)*0.12,W/2,H*0.5,Math.max(W,H)*0.7);
    if(VFX.washColor==="amber"){
      g.addColorStop(0,`rgba(255,196,0,${a})`); g.addColorStop(1,"rgba(255,196,0,0)");
    }else if(VFX.washColor==="cyan"){
      g.addColorStop(0,`rgba(62,199,244,${a})`); g.addColorStop(1,"rgba(62,199,244,0)");
    }else{
      g.addColorStop(0,`rgba(244,247,241,${a*0.7})`); g.addColorStop(1,"rgba(244,247,241,0)");
    }
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
  }
  // Soft always-on bloom lift during resolve for high-force kicks.
  if(S?.phase==="resolve" && VFX.intensity>0.45){
    const a=0.06*VFX.intensity;
    cx.fillStyle=`rgba(255,220,140,${a})`;
    cx.globalCompositeOperation="screen";
    cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation="source-over";
  }
}

/* Neural FX hero plate (from /fx/hero) */
const HERO={img:null, kick:-1, backend:null, pending:false, ms:0};
function setFxBadge(backend){
  const el=$("fxBadge");
  if(!el) return;
  el.classList.remove("on","qnn");
  if(backend==="qnn"){ el.textContent="FX · QNN"; el.classList.add("qnn"); }
  else if(backend==="cpu"){ el.textContent="FX · CPU"; el.classList.add("on"); }
  else if(backend==="procedural"){ el.textContent="FX · NPU-READY"; el.classList.add("on"); }
  else if(backend){ el.textContent="FX · "+String(backend).toUpperCase(); el.classList.add("on"); }
  else el.textContent="FX · OFF";
}
async function probeFxStatus(){
  try{
    const r=await fetch("/fx/status");
    const j=await r.json();
    setFxBadge(j.backend||"procedural");
  }catch(_){ setFxBadge(null); }
}
async function requestHeroPlate(st){
  if(!st?.last || HERO.pending) return;
  if(!["goal","save","post"].includes(st.last.result)) return;
  const kick=st.kick;
  if(HERO.kick===kick && HERO.img) return;
  HERO.pending=true;
  try{
    const body={
      frames: st.replay?.frames||[],
      force: st.last.force,
      result: st.last.result,
      height: st.last.height,
      spin: st.last.spin,
      strike: st.last.strike,
      foot: st.last.foot,
    };
    const r=await fetch("/fx/hero",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body),
    });
    const j=await r.json();
    if(!j?.ok || !j.plate) return;
    const im=new Image();
    im.onload=()=>{
      if(S?.kick===kick){ HERO.img=im; HERO.kick=kick; HERO.backend=j.backend; HERO.ms=j.ms||0; setFxBadge(j.backend); }
    };
    im.src=j.plate;
    setFxBadge(j.backend||"procedural");
  }catch(_){ /* degrade silently */ }
  finally{ HERO.pending=false; }
}
probeFxStatus();

/* ============================ websocket ============================ */
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen =()=>ws.send(JSON.stringify({type:"hello",client:"tv"}));
  ws.onclose=()=>setTimeout(connect,1500);
  ws.onmessage=ev=>onState(JSON.parse(ev.data));
}
$("startBtn").onclick=()=>{ if(!S)return;
  ws.send(JSON.stringify({type:S.phase==="end"?"again":"start"})); };
$("abortBtn").onclick=()=>{
  if(!S||S.phase==="lobby"||!ws||ws.readyState!==1) return;
  if(!confirm("End this match and return to the lobby?")) return;
  $("abortBtn").disabled=true;
  $("abortBtn").textContent="ENDING…";
  ws.send(JSON.stringify({type:"abort"}));
};

/* ============================ HUD ============================ */
function dots(el, forKeeper){
  el.innerHTML="";
  const shots=S.shotmap||[];
  for(let i=0;i<S.kicksTotal;i++){
    const d=document.createElement("div"); d.className="dot";
    if(shots[i]){
      if(forKeeper){ if(shots[i].result!=="goal") d.classList.add("save"); }
      else d.classList.add(shots[i].result);
    }
    if(!forKeeper && shots.length===i &&
       ["announce","countdown","shoot"].includes(S.phase)) d.classList.add("now");
    el.appendChild(d);
  }
}
function onState(st){
  prev=S; S=st;
  $("sYou").textContent=st.score; $("sWall").textContent=st.saves;
  dots($("dYou"),false); dots($("dWall"),true);

  $("midTop").textContent = st.phase==="lobby"?"LOBBY":st.phase==="end"?"FULL TIME":"SHOOTOUT";
  $("midBot").textContent = st.phase==="end"||st.phase==="lobby"?"GESTURE FOOTBALL":
    `KICK ${st.kick} OF ${st.kicksTotal}`;

  $("ledP").classList.toggle("on",!!st.connected?.phone);

  const desk=$("desk");
  desk.className="desk "+(st.llm?"live":"tmpl");
  $("deskName").textContent=st.llm==="cloud"?"CLAUDE DESK":st.llm==="local"?"LOCAL AI DESK":"TEMPLATE DESK";
  if(st.line) $("line").textContent=st.line;

  const big=$("big"), sub=$("sub"), btn=$("startBtn"), abort=$("abortBtn");
  big.className=""; btn.classList.add("hide");
  // END MATCH visible for any live / full-time phase (not lobby).
  abort.classList.toggle("hide", st.phase==="lobby");
  if(st.phase!=="lobby"){ abort.disabled=false; abort.textContent="END MATCH"; }
  switch(st.phase){
    case "lobby":
      big.textContent="GESTURE FOOTBALL";
      sub.textContent=st.connected?.phone?"striker ready — THE WALL awaits":"waiting for the striker…";
      btn.classList.remove("hide"); btn.disabled=!st.connected?.phone;
      btn.textContent="START MATCH"; break;
    case "announce":
      big.textContent=`KICK ${st.kick}`;
      sub.textContent=st.line||"aim with your hand — THE WALL is watching it"; break;
    case "countdown":
      big.textContent=Math.max(1,Math.ceil(st.timerMs/1000));
      sub.textContent="…"; pop(); break;
    case "shoot":
      big.textContent="KICK!"; big.className="goal";
      sub.textContent="swing your leg when ready — feint with your hand";
      if(prev?.phase!=="shoot") pop(); break;
    case "resolve":{
      const r=st.last?.result;
      big.textContent=r==="goal"?"GOAL!":r==="save"?"SAVED!":r==="post"?"POST!":"SKIED!";
      big.className=r==="goal"?"goal":r==="save"?"save":"warn";
      const bits=[];
      if(st.last?.force) bits.push(`${st.last.force} N`);
      if(st.last?.strike) bits.push(String(st.last.strike).toUpperCase());
      if(st.last?.height==="H") bits.push("HIGH");
      else if(st.last?.height==="L") bits.push("LOW");
      bits.push("FORCEPOSE");
      sub.textContent=bits.join(" · ");
      if(prev?.phase!=="resolve"){
        pop();
        vfxArmFromLast(st.last);
        shoot(st.last);
        requestHeroPlate(st);
      } else if(st.replay?.frames?.length && HERO.kick!==st.kick){
        requestHeroPlate(st);
      }
      break;}
    case "end":{
      big.textContent=`${st.score} / ${st.kicksTotal}`;
      big.className=st.score>st.kicksTotal/2?"goal":"save";
      sub.textContent=st.score>st.kicksTotal/2?"YOU BEAT THE WALL":"THE WALL STANDS";
      btn.classList.remove("hide"); btn.disabled=false; btn.textContent="PLAY AGAIN"; break;}
  }
  speakLine(st);
  sceneOnState(st,prev);
}
function pop(){ const b=$("big"); b.classList.add("pop"); setTimeout(()=>b.classList.remove("pop"),130); }

/* ==================== keeper voice (laptop speakers) ==================== */
let soundOn=true, spokenKey="";
$("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  $("soundBtn").textContent=soundOn?"SOUND ON":"SOUND OFF";
  $("soundBtn").classList.toggle("off",!soundOn);
  if(!soundOn&&"speechSynthesis"in window) speechSynthesis.cancel();
  if(soundOn) audioBoot();
  rampAmb(soundOn?0.05:0.0,0.6);
};
function speakLine(st){
  if(!soundOn||!st.line||!("speechSynthesis"in window))return;
  if(!["announce","resolve","end"].includes(st.phase))return;
  // one line per kick+phase — the async AI-desk upgrade must not re-speak
  const key=`${st.phase}:${st.kick}`;
  if(key===spokenKey)return;
  spokenKey=key;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(st.line);
  u.rate=1.05; u.pitch=0.8;
  speechSynthesis.speak(u);
}

/* ==================== procedural stadium audio (WebAudio) ==================== */
let AC=null, AMB=null, NOISE=null;
function audioBoot(){
  if(!soundOn) return;
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      // white noise buffer for bursts
      NOISE=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
      const nd=NOISE.getChannelData(0);
      for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
      // looping crowd bed: brownish noise -> lowpass -> gentle gain with slow swell
      const bed=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);
      const bd=bed.getChannelData(0); let v=0;
      for(let i=0;i<bd.length;i++){ v=v*0.986+(Math.random()*2-1)*0.055; bd[i]=v*2.6; }
      const src=AC.createBufferSource(); src.buffer=bed; src.loop=true;
      const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=520; lp.Q.value=0.4;
      AMB=AC.createGain(); AMB.gain.value=0;
      const lfo=AC.createOscillator(), lg=AC.createGain();
      lfo.frequency.value=0.11; lg.gain.value=0.012;
      lfo.connect(lg); lg.connect(AMB.gain); lfo.start();
      src.connect(lp); lp.connect(AMB); AMB.connect(AC.destination); src.start();
      rampAmb(0.05,2.0);
    }
    if(AC.state==="suspended") AC.resume();
  }catch(e){/* audio unavailable — stay silent */}
}
addEventListener("pointerdown",audioBoot);
$("startBtn").addEventListener("click",audioBoot);
function rampAmb(v,t){ if(!AMB||!AC) return;
  AMB.gain.cancelScheduledValues(AC.currentTime);
  AMB.gain.setTargetAtTime(v,AC.currentTime,Math.max(0.05,t)); }
function sfxReady(){ return AC && soundOn && AC.state==="running"; }
function noiseBurst(f0,f1,dur,g,q=0.8){
  if(!sfxReady()) return;
  const t=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=q;
  bp.frequency.setValueAtTime(f0,t);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur*0.7);
  const gn=AC.createGain();
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(g,t+0.09);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp); bp.connect(gn); gn.connect(AC.destination);
  src.start(t); src.stop(t+dur+0.1);
}
function sfxCheer(big){
  noiseBurst(900,big?2800:2200,big?2.6:1.4,big?0.15:0.08,0.7);
  if(AMB&&AC){ rampAmb(big?0.11:0.08,0.15); setTimeout(()=>rampAmb(0.05,1.2),big?2200:1200); }
}
function sfxGroan(){ noiseBurst(750,230,1.2,0.09,1.1);
  if(AMB&&AC){ rampAmb(0.07,0.1); setTimeout(()=>rampAmb(0.05,1.2),700); } }
function sfxWhistle(){
  if(!sfxReady()) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(); o.type="sine"; o.frequency.value=2280;
  const vib=AC.createOscillator(); vib.frequency.value=34;
  const vg=AC.createGain(); vg.gain.value=55; vib.connect(vg); vg.connect(o.frequency);
  const gn=AC.createGain();
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.055,t+0.015);
  gn.gain.setValueAtTime(0.055,t+0.30);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
  o.connect(gn); gn.connect(AC.destination);
  o.start(t); vib.start(t); o.stop(t+0.45); vib.stop(t+0.45);
}
function sfxClang(){
  if(!sfxReady()) return;
  const t=AC.currentTime;
  [618,1560,2450].forEach((f,i)=>{
    const o=AC.createOscillator(); o.frequency.value=f*(1+(Math.random()-0.5)*0.01);
    const gn=AC.createGain();
    gn.gain.setValueAtTime(0.07/(i+1),t);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
    o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t+0.4);
  });
}
function sfxThud(){ noiseBurst(320,90,0.15,0.14,0.6); }

const cv=$("pitch"), cx=cv.getContext("2d");
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ez=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const FBLK="'Arial Black','Archivo Black',Impact,sans-serif";
const FCND="'Barlow Condensed','Arial Narrow',Arial,sans-serif";

/* ---- world geometry (metres). Camera sits behind the penalty spot. ---- */
const M={DG:16.8, DK:16.25, DSPOT:5.8, DBOARD:19.3, GW:7.32, GH:2.44, CAMH:1.75};
let W=0,H=0,DPR=1,camF=0,HZY=0,GY=0,BARY=0,GLX=0,GRX=0,SPX=0,SPY=0;
let STOP=0,SBOT=0,CH=0,BRDT=0,BRDB=0,BRDH=0,TIERS=[],FLP=[];
const sc=d=>camF/d, gy=d=>HZY+M.CAMH*sc(d), PXX=(x,d)=>W/2+x*sc(d);
const Z2X=z=>z==="L"?-M.GW/3:z==="R"?M.GW/3:0;    // zone → lateral metres

/* offscreen layers */
let LBG=null,LCA=null,LCB=null,LPITCH=null,LVIG=null,LBRD=null,LBRDW=0;
const mk=(w,h)=>{const c=document.createElement("canvas");c.width=Math.max(2,w|0);c.height=Math.max(2,h|0);return c;};

/* Stadium plate only — keeper/striker are live vector people (no photo frames). */
const PHOTO={stadium:null,ready:false};
(function loadPhoto(){
  const im=new Image();
  im.onload=()=>{PHOTO.stadium=im; PHOTO.ready=true;};
  im.onerror=()=>{};
  im.src="img/stadium_bg.png";
})();
function coverDraw(img,x,y,w,h){
  if(!img) return false;
  const ir=img.width/img.height, rr=w/h;
  let sx=0,sy=0,sw=img.width,sh=img.height;
  if(ir>rr){ sw=img.height*rr; sx=(img.width-sw)/2; }
  else { sh=img.width/rr; sy=(img.height-sh)/2; }
  cx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  return true;
}

/* crowd sections */
const NC=26; let colW=0;
const colSeed=[], cyanCol=[], amberCol=[];
for(let i=0;i<NC;i++){ colSeed.push(Math.random()*10);
  cyanCol.push(i>=10&&i<=15); amberCol.push((i>=3&&i<=4)||(i>=21&&i<=22)); }

/* ---------------------------- rebuild on resize ---------------------------- */
function rebuild(){
  DPR=Math.min(window.devicePixelRatio||1,1.25);
  W=Math.max(640,Math.round(innerWidth*DPR));
  H=Math.max(400,Math.round(innerHeight*DPR));
  cv.width=W; cv.height=H;
  camF=Math.min(0.85*W,1.95*H);
  HZY=H*0.875-M.CAMH*sc(M.DSPOT);
  GY=gy(M.DG); BARY=GY-M.GH*sc(M.DG);
  GLX=PXX(-M.GW/2,M.DG); GRX=PXX(M.GW/2,M.DG);
  SPX=W/2; SPY=gy(M.DSPOT);
  BRDB=gy(M.DBOARD); BRDH=Math.max(16,0.95*sc(M.DBOARD)); BRDT=BRDB-BRDH;
  STOP=H*0.10; SBOT=BRDT-H*0.004; CH=SBOT-STOP; colW=W/NC;
  FLP=[[W*0.115,H*0.042],[W*0.885,H*0.042]];
  const h=CH;
  TIERS=[{y0:STOP,       y1:STOP+h*0.27,r:H*0.0022,cap:9,sh:0.5},
         {y0:STOP+h*0.34,y1:STOP+h*0.60,r:H*0.0029,cap:8,sh:0.72},
         {y0:STOP+h*0.68,y1:STOP+h*0.99,r:H*0.0037,cap:7,sh:1.0}];
  buildSky(); buildCrowd(); buildBoards(); buildPitch(); buildVig();
}
let rszT=null;
addEventListener("resize",()=>{clearTimeout(rszT);rszT=setTimeout(rebuild,140);});

/* ---------------------------- static: sky + bowl ---------------------------- */
function buildSky(){
  LBG=mk(W,H); const c=LBG.getContext("2d");
  // night sky above the roof line
  const sky=c.createLinearGradient(0,0,0,STOP);
  sky.addColorStop(0,"#02040a"); sky.addColorStop(0.7,"#071120"); sky.addColorStop(1,"#0b1a2c");
  c.fillStyle=sky; c.fillRect(0,0,W,STOP+4);
  for(let i=0;i<90;i++){ // stars
    c.fillStyle=`rgba(220,235,255,${0.2+Math.random()*0.5})`;
    c.fillRect(Math.random()*W,Math.random()*H*0.05,1.4,1.4);
  }
  // stand tiers (structure behind the crowd)
  TIERS.forEach(t=>{
    const g=c.createLinearGradient(0,t.y0,0,t.y1);
    g.addColorStop(0,`rgba(26,38,50,${t.sh})`); g.addColorStop(1,`rgba(14,22,31,${t.sh})`);
    c.fillStyle=g; c.fillRect(0,t.y0-H*0.03,W,(t.y1-t.y0)+H*0.045);
  });
  // walkways between tiers + rails
  for(let i=0;i<TIERS.length-1;i++){
    const y=(TIERS[i].y1+TIERS[i+1].y0)/2;
    c.fillStyle="#232f3b"; c.fillRect(0,y-H*0.007,W,H*0.014);
    c.fillStyle="rgba(150,180,205,.28)"; c.fillRect(0,y-H*0.007,W,1.5);
  }
  // pitch-side wall below the lowest tier
  c.fillStyle="#1b2836"; c.fillRect(0,TIERS[2].y1,W,SBOT-TIERS[2].y1+H*0.01);
  c.fillStyle="rgba(120,160,190,.22)"; c.fillRect(0,TIERS[2].y1,W,1.5);
  // bowl edge shading (stadium curves away at the sides)
  const eL=c.createLinearGradient(0,0,W*0.14,0);
  eL.addColorStop(0,"rgba(2,5,10,.62)"); eL.addColorStop(1,"rgba(2,5,10,0)");
  c.fillStyle=eL; c.fillRect(0,STOP-H*0.03,W*0.14,SBOT-STOP+H*0.05);
  const eR=c.createLinearGradient(W,0,W*0.86,0);
  eR.addColorStop(0,"rgba(2,5,10,.62)"); eR.addColorStop(1,"rgba(2,5,10,0)");
  c.fillStyle=eR; c.fillRect(W*0.86,STOP-H*0.03,W*0.14,SBOT-STOP+H*0.05);
  // roof band with lit under-edge + struts (sky stays visible above it)
  const roofTop=H*0.055;
  const rg=c.createLinearGradient(0,roofTop,0,STOP);
  rg.addColorStop(0,"#0a1119"); rg.addColorStop(1,"#15202c");
  c.fillStyle=rg; c.fillRect(0,roofTop,W,STOP-roofTop);
  // roof silhouette curve
  c.fillStyle="#060b12";
  c.beginPath(); c.moveTo(0,roofTop);
  c.quadraticCurveTo(W/2,roofTop-H*0.02,W,roofTop);
  c.lineTo(W,roofTop+H*0.012); c.quadraticCurveTo(W/2,roofTop-H*0.008,0,roofTop+H*0.012);
  c.closePath(); c.fill();
  c.fillStyle="rgba(160,215,255,.42)"; c.fillRect(0,STOP-2,W,2);
  c.fillStyle="rgba(3,6,10,.8)";
  for(let x=W*0.04;x<W;x+=W/13) c.fillRect(x,roofTop+H*0.004,Math.max(2,W*0.0022),STOP-roofTop);
  // floodlight towers rising above the roof
  FLP.forEach(([fx,fy])=>{
    const fw=W*0.052, fh=H*0.034;
    c.fillStyle="#0d141c";
    c.fillRect(fx-fw*0.09,fy,fw*0.18,STOP-fy);            // mast
    c.beginPath(); c.moveTo(fx-fw*0.28,STOP); c.lineTo(fx,fy+fh*0.4); c.lineTo(fx+fw*0.28,STOP);
    c.lineWidth=Math.max(1.5,W*0.0012); c.strokeStyle="#0d141c"; c.stroke();
    c.fillStyle="#10181f";
    c.beginPath(); c.roundRect(fx-fw/2,fy-fh/2,fw,fh,4); c.fill();
    c.strokeStyle="#2a3947"; c.lineWidth=1; c.stroke();
    c.save(); c.shadowColor="#dff2ff"; c.shadowBlur=7;
    c.fillStyle="#f3fbff";
    for(let i=0;i<8;i++)for(let j=0;j<3;j++){
      c.beginPath();
      c.arc(fx-fw/2+fw*(i+0.5)/8, fy-fh/2+fh*(j+0.5)/3, Math.max(1.4,H*0.0032),0,7);
      c.fill();
    }
    c.restore();
  });
}

/* ---------------------------- static: the crowd ---------------------------- */
function buildCrowd(){
  LCA=mk(W,CH); LCB=mk(W,CH);
  const a=LCA.getContext("2d"), b=LCB.getContext("2d");
  const skins=["#d6b28c","#c08d5b","#a06c42","#7a4f2e","#5e3c22","#e0c2a2"];
  const neut=["#8d8577","#68737f","#485561","#7d6a55","#5e5268","#737d88","#3e4a55","#83776a","#525f6b","#6b5b50","#4a4139","#5a6b73"];
  const cyanS=["#37b1da","#2a91b8","#4fc3e8","#1f7ba0","#7fd0ea","#256e88"];
  const ambS=["#d8a800","#b98f00","#e0b83c","#9c7c00","#8a6d00"];
  const R=Math.random;
  TIERS.forEach(t=>{
    const rows=Math.min(t.cap,Math.floor((t.y1-t.y0)/(t.r*3.1)));
    for(let rw=0;rw<rows;rw++){
      const yBase=t.y0+(rw+0.5)*((t.y1-t.y0)/rows);
      const step=t.r*2.45;
      for(let x=step*R();x<W;x+=step*(0.9+R()*0.2)){
        if(((x/W*9)%1)<0.028) continue;              // aisles
        if(R()<0.06) continue;                        // empty seats
        const nx=(x-W/2)/(W/2);
        const y=yBase-H*0.024*nx*nx+(R()-0.5)*t.r*1.2-STOP;
        const col=clamp(Math.floor(x/colW),0,NC-1);
        let shirt;
        const p=R();
        if(cyanCol[col]&&p<0.7) shirt=cyanS[(R()*cyanS.length)|0];
        else if(amberCol[col]&&p<0.55) shirt=ambS[(R()*ambS.length)|0];
        else shirt=neut[(R()*neut.length)|0];
        const skin=skins[(R()*skins.length)|0];
        const hair=R()<0.75?"#1b1712":"#4a3d2e";
        const r=t.r*(0.9+R()*0.25), sh=t.sh;
        drawFan(a,x,y,r,shirt,skin,hair,sh,false);
        drawFan(b,x,y,r,shirt,skin,hair,sh,true);
      }
    }
  });
}
function drawFan(c,x,y,r,shirt,skin,hair,sh,up){
  c.globalAlpha=0.42+0.5*sh;
  if(!up){
    c.fillStyle=shirt; c.fillRect(x-r*0.95,y+r*0.5,r*1.9,r*2.3);   // seated body
    c.fillStyle=skin;  c.beginPath(); c.arc(x,y,r*0.85,0,7); c.fill();
    c.fillStyle=hair;  c.fillRect(x-r*0.7,y-r*0.95,r*1.4,r*0.62);
  }else{
    c.fillStyle=shirt; c.fillRect(x-r*0.95,y-r*0.9,r*1.9,r*3.5);   // standing body
    if(r>=2.1){                                                     // arms up
      c.strokeStyle=shirt; c.lineWidth=Math.max(1,r*0.5); c.lineCap="round";
      c.beginPath();
      c.moveTo(x-r*0.8,y-r*0.6); c.lineTo(x-r*1.6,y-r*3.1);
      c.moveTo(x+r*0.8,y-r*0.6); c.lineTo(x+r*1.6,y-r*3.1);
      c.stroke();
      c.fillStyle=skin;
      c.beginPath(); c.arc(x-r*1.6,y-r*3.2,r*0.42,0,7); c.fill();
      c.beginPath(); c.arc(x+r*1.6,y-r*3.2,r*0.42,0,7); c.fill();
    }
    c.fillStyle=skin; c.beginPath(); c.arc(x,y-r*1.8,r*0.85,0,7); c.fill();
    c.fillStyle=hair; c.fillRect(x-r*0.7,y-r*2.75,r*1.4,r*0.62);
  }
  c.globalAlpha=1;
}

/* ---------------------------- static: LED ad boards ---------------------------- */
const BRANDS=[["FORCEPOSE","#FFC400"],["SENTINELMESH","#3EC7F4"],["THE WALL","#e9f2f7"],
              ["GESTURE FC","#3ddc74"],["BULLET-TIME","#FFC400"],["POSE//NET","#3EC7F4"],
              ["MESHCAM","#e9f2f7"],["NIGHT LEAGUE","#ff8a3c"]];
function buildBoards(){
  LBRDW=Math.max(W,1400);
  LBRD=mk(LBRDW,BRDH); const c=LBRD.getContext("2d");
  c.fillStyle="#0b131d"; c.fillRect(0,0,LBRDW,BRDH);
  const fs=Math.max(9,BRDH*0.5);
  c.font=`900 ${fs}px ${FCND}`; c.textBaseline="middle";
  let x=0,i=0;
  while(x<LBRDW){
    const [name,colr]=BRANDS[i%BRANDS.length];
    const wTxt=c.measureText(name).width, bw=wTxt+fs*2.2;
    if(i%3===2){ c.fillStyle=colr; c.fillRect(x,0,bw,BRDH); c.fillStyle="#0b131d"; }
    else { c.fillStyle="#0b131d"; c.fillRect(x,0,bw,BRDH); c.fillStyle=colr; }
    c.textAlign="center"; c.fillText(name,x+bw/2,BRDH*0.54);
    c.strokeStyle="rgba(0,0,0,.5)"; c.lineWidth=1;
    c.strokeRect(x+0.5,0.5,bw-1,BRDH-1);
    x+=bw; i++;
  }
  c.fillStyle="rgba(0,0,0,.22)";                       // LED scanlines
  for(let y=0;y<BRDH;y+=3) c.fillRect(0,y,LBRDW,1);
  const g=c.createLinearGradient(0,0,0,BRDH);          // sheen
  g.addColorStop(0,"rgba(255,255,255,.08)"); g.addColorStop(0.25,"rgba(255,255,255,0)");
  g.addColorStop(1,"rgba(0,0,0,.25)");
  c.fillStyle=g; c.fillRect(0,0,LBRDW,BRDH);
  c.fillStyle="rgba(4,9,15,.38)";                      // keep boards behind the action
  c.fillRect(0,0,LBRDW,BRDH);
}

/* ---------------------------- static: pitch ---------------------------- */
function buildPitch(){
  LPITCH=mk(W,H); const c=LPITCH.getContext("2d");
  // grass base with floodlit falloff (brighter far, darker near camera)
  const g=c.createLinearGradient(0,BRDB,0,H);
  g.addColorStop(0,"#2e8449"); g.addColorStop(0.45,"#256e3c"); g.addColorStop(1,"#153f24");
  c.fillStyle=g; c.fillRect(0,BRDB-1,W,H-BRDB+2);
  // mowed stripes: bands between equal world-depth steps
  c.fillStyle="rgba(8,30,16,.18)";
  const dBot=M.CAMH*camF/(H+60-HZY);
  let dark=true;
  for(let d=Math.max(1.6,dBot);d<M.DBOARD;d+=2.0){
    dark=!dark; if(dark) continue;
    const y1=Math.min(H+2,gy(d)), y2=gy(Math.min(M.DBOARD,d+2.0));
    c.fillRect(0,y2,W,y1-y2);
  }
  // light pools from the floodlights
  [[W*0.3],[W*0.7]].forEach(([lx])=>{
    const lg=c.createRadialGradient(lx,H*0.8,10,lx,H*0.8,W*0.42);
    lg.addColorStop(0,"rgba(235,255,235,.07)"); lg.addColorStop(1,"rgba(235,255,235,0)");
    c.fillStyle=lg; c.fillRect(0,BRDB,W,H-BRDB);
  });
  // grass noise
  for(let i=0;i<1600;i++){
    const y=BRDB+(H-BRDB)*Math.pow(Math.random(),0.72);
    const w=1+Math.random()*1.6;
    c.fillStyle=Math.random()<0.5?"rgba(6,26,12,.10)":"rgba(210,255,215,.05)";
    c.fillRect(Math.random()*W,y,w,w*0.6);
  }
  // white markings
  const lw=d=>Math.max(2,0.12*sc(d));
  c.strokeStyle="rgba(244,250,244,.85)"; c.lineCap="butt";
  c.lineWidth=lw(M.DG);                                   // goal line
  c.beginPath(); c.moveTo(PXX(-15,M.DG),GY); c.lineTo(PXX(15,M.DG),GY); c.stroke();
  const d6=M.DG-5.5, hw6=9.16;                            // six-yard box
  c.lineWidth=lw((M.DG+d6)/2);
  c.beginPath();
  c.moveTo(PXX(-hw6,M.DG),GY); c.lineTo(PXX(-hw6,d6),gy(d6));
  c.lineTo(PXX(hw6,d6),gy(d6)); c.lineTo(PXX(hw6,M.DG),GY);
  c.stroke();
  c.fillStyle="rgba(244,250,244,.9)";                     // penalty spot
  c.beginPath(); c.ellipse(SPX,SPY,0.16*sc(M.DSPOT),0.16*sc(M.DSPOT)*0.38,0,0,7); c.fill();
  // shadow cast by the ad boards onto the grass edge
  const sg=c.createLinearGradient(0,BRDB,0,BRDB+H*0.02);
  sg.addColorStop(0,"rgba(0,10,4,.4)"); sg.addColorStop(1,"rgba(0,10,4,0)");
  c.fillStyle=sg; c.fillRect(0,BRDB,W,H*0.02);
}

/* ---------------------------- static: vignette + glow ---------------------------- */
function buildVig(){
  LVIG=mk(W,H); const c=LVIG.getContext("2d");
  const v=c.createRadialGradient(W/2,H*0.42,Math.min(W,H)*0.45,W/2,H*0.46,Math.max(W,H)*0.78);
  v.addColorStop(0,"rgba(2,6,12,0)"); v.addColorStop(1,"rgba(2,6,12,.52)");
  c.fillStyle=v; c.fillRect(0,0,W,H);
  const tp=c.createLinearGradient(0,0,0,H*0.14);
  tp.addColorStop(0,"rgba(2,6,12,.55)"); tp.addColorStop(1,"rgba(2,6,12,0)");
  c.fillStyle=tp; c.fillRect(0,0,W,H*0.14);
  const bt=c.createLinearGradient(0,H,0,H*0.84);
  bt.addColorStop(0,"rgba(2,6,12,.6)"); bt.addColorStop(1,"rgba(2,6,12,0)");
  c.fillStyle=bt; c.fillRect(0,H*0.84,W,H*0.16);
  FLP.forEach(([fx,fy])=>{                              // floodlight halos over everything
    const gl=c.createRadialGradient(fx,fy,4,fx,fy,H*0.14);
    gl.addColorStop(0,"rgba(215,240,255,.30)"); gl.addColorStop(1,"rgba(215,240,255,0)");
    c.fillStyle=gl; c.beginPath(); c.arc(fx,fy,H*0.14,0,7); c.fill();
  });
}

/* ============================== FX / crowd state ============================== */
const FX={exc:new Float32Array(NC),flashes:[],confetti:[],rings:[],
          flashRate:1.2,flashBurst:0,shakeT:-1e9,shakeAmp:0,dimT:-1e9,
          celebT:-1e9,celebDur:1,celebCols:null,waveT:-1e9,nextWave:performance.now()+6000,
          postHitT:-1e9,ripple:null};
function celebrate(cols,dur){ FX.celebT=performance.now(); FX.celebDur=dur; FX.celebCols=cols; }
function shake(amp){ FX.shakeT=performance.now(); FX.shakeAmp=amp*H/900; }
function dimStands(){ FX.dimT=performance.now(); }
function burstConfetti(n){
  for(let i=0;i<n;i++){
    FX.confetti.push({x:W/2+(Math.random()-0.5)*W*0.66, y:BRDT+Math.random()*H*0.04,
      vx:(Math.random()-0.5)*W*0.07, vy:-H*(0.16+Math.random()*0.34),   // px per second
      rot:Math.random()*7, vr:(Math.random()-0.5)*9, seed:Math.random()*9,
      col:["#FFC400","#3EC7F4","#F4F7F1","#3ddc74","#ff8a3c"][(Math.random()*5)|0],
      t0:performance.now()});
  }
}
function ringAt(x,y){ FX.rings.push({x,y,t0:performance.now()}); }

function updateCrowd(now,dt){
  const ph=S?.phase||"lobby";
  if((ph==="lobby"||ph==="announce")&&now>FX.nextWave&&now-FX.celebT>FX.celebDur){
    FX.waveT=now; FX.nextWave=now+15000+Math.random()*9000;
  }
  const wp=(now-FX.waveT)/5600;
  const ct=(now-FX.celebT)/FX.celebDur;
  for(let i=0;i<NC;i++){
    let e=0;
    if(wp>=0&&wp<=1){ const wx=(wp*1.3-0.15)*NC, d=i-wx; e+=Math.exp(-d*d/5); }
    if(ct>=0&&ct<1&&(!FX.celebCols||FX.celebCols[i]))
      e+=(1-ct)*(0.55+0.45*Math.sin(now/92+colSeed[i]*9));
    FX.exc[i]+=(clamp(e,0,1)-FX.exc[i])*Math.min(1,dt*9);
  }
  const rate=FX.flashRate+(now<FX.flashBurst?26:0);
  if(Math.random()<rate*dt)
    FX.flashes.push({x:Math.random()*W,y:STOP+Math.random()*CH*0.95,t0:now});
}
function drawCrowd(now){
  cx.drawImage(LCA,0,STOP);
  const JMP=H*0.015;
  for(let i=0;i<NC;i++){
    const e=FX.exc[i];
    if(e>0.05){
      // hide the seated column behind the standing copy (no ghost double-image)
      cx.globalAlpha=clamp(e*1.15,0,1);
      cx.fillStyle="#101a24";
      cx.fillRect(i*colW,STOP,colW,CH);
      cx.drawImage(LCB,i*colW,0,colW,CH,i*colW,STOP-e*JMP,colW,CH);
      cx.globalAlpha=1;
    }
  }
  // idle murmur shimmer
  const by=STOP+((now*0.018)%CH);
  const mg=cx.createLinearGradient(0,by-CH*0.12,0,by+CH*0.12);
  mg.addColorStop(0,"rgba(255,255,255,0)");
  mg.addColorStop(0.5,"rgba(255,255,255,.022)");
  mg.addColorStop(1,"rgba(255,255,255,0)");
  cx.fillStyle=mg; cx.fillRect(0,STOP,W,CH);
  // groan dim
  const dq=(now-FX.dimT)/900;
  if(dq>=0&&dq<1){
    cx.fillStyle=`rgba(3,8,16,${0.30*(1-dq)*(dq<0.12?dq/0.12:1)})`;
    cx.fillRect(0,STOP-H*0.02,W,CH+H*0.03);
  }
  // camera flashes
  for(let i=FX.flashes.length-1;i>=0;i--){
    const f=FX.flashes[i], t=(now-f.t0)/240;
    if(t>1){ FX.flashes.splice(i,1); continue; }
    cx.fillStyle=`rgba(255,255,255,${0.85*(1-t)})`;
    cx.beginPath(); cx.arc(f.x,f.y,(1.4+2.6*t)*H/900,0,7); cx.fill();
    cx.fillStyle=`rgba(200,230,255,${0.25*(1-t)})`;
    cx.beginPath(); cx.arc(f.x,f.y,(4+7*t)*H/900,0,7); cx.fill();
  }
}
function drawBoards(now){
  const off=(now*0.024*(W/1600))%LBRDW;
  cx.drawImage(LBRD,-off,BRDT); cx.drawImage(LBRD,LBRDW-off,BRDT);
}
function shakeOff(now){
  const q=(now-FX.shakeT)/650;
  if(q<0||q>1) return [0,0];
  const a=FX.shakeAmp*(1-q);
  return [Math.sin(q*47)*a,Math.cos(q*61)*a*0.7];
}

/* ============================== the ball ============================== */
let B={x:0,y:0.11,d:M.DSPOT,vx:0,vy:0,vd:0,mode:"rest",rot:0,curve:0,res:null,zone:null,
       t0:0,tImpact:0,katch:false,trail:[],netFrom:null,netTo:null};
function ballRollIn(){
  B={x:2.6,y:0.11,d:4.1,vx:0,vy:0,vd:0,mode:"rollin",rot:0,curve:0,res:null,zone:null,
     t0:performance.now(),tImpact:0,katch:false,trail:[],netFrom:null,netTo:null};
}
function ballReset(){ B.mode="rest"; B.x=0; B.y=0.11; B.d=M.DSPOT; B.trail=[]; }

function shoot(last){                       // called by the HUD on resolve entry
  if(!last) return;
  vfxArmFromLast(last);
  const res=last.result, z=last.zone, kz=last.keeperZone||"C";
  const power=last.power??0.5;
  let tx,ty,td=M.DG;
  // Longer flight so the eye can track the ball into the goal.
  const T=0.62+0.28*(1-power);
  if(res==="over"||!z){ tx=(Math.random()*2-1)*1.4; ty=3.1+Math.random()*0.8; }
  else if(res==="post"){
    if(z==="C"){ tx=(Math.random()<0.5?-1:1)*0.35; ty=M.GH; }
    else{ tx=(z==="L"?-1:1)*(M.GW/2); ty=0.9+Math.random()*1.1; }
  }else{
    // Prefer height band from ForcePose when present.
    const high=last.height==="H" || last.strike==="chip";
    tx=Z2X(z)+(Math.random()*2-1)*0.28;
    ty=high?(1.45+Math.random()*0.55):(z==="C"?0.45+Math.random()*0.7:0.55+Math.random()*0.95);
  }
  if(res==="save") td=M.DK; else if(res==="goal") td=M.DG+0.12;
  const t0=performance.now();
  // Plant/load first, then ball leaves at foot contact (~35% of kick anim).
  const contact=0.17;
  const kickT=contact/0.35;
  // Curve: prefer explicit spin; fall back to dirDeg.
  const dirDeg=typeof last.dirDeg==="number"?last.dirDeg:0;
  const spinIn=typeof last.spin==="number"?clamp(last.spin,-1,1):clamp(dirDeg/45,-1,1);
  const driveBoost=last.strike==="drive"?1.15:last.strike==="chip"?0.72:1;
  const spin=(spinIn*(Math.random()*0.25+0.8)+(Math.random()*2-1)*0.12)*driveBoost;
  const tFly=t0+contact*1000;
  B={x:0,y:0.11,d:M.DSPOT,mode:"windup",rot:0,res,zone:z,t0,tFly,tImpact:tFly+T*1000,trail:[],
     curve:spin*2.4,
     katch:res==="save"&&power<0.62&&z===kz,netFrom:null,netTo:null,
     tx,ty,td,T,strike:last.strike||"drive",force:last.force||0};
  B.vx=(tx-0-0.5*B.curve*T*T)/T;
  B.vy=(ty-0.11+4.9*T*T)/T;
  B.vd=(td-M.DSPOT)/T;
  // Striker plants and swings from the same kick packet.
  strikerKick(last,t0,kickT);
  // keeper dive brief — reacts as the ball leaves the boot
  const dz=res==="save"?(z||kz):kz;
  dive={t0:tFly,dir:dz==="L"?-1:dz==="R"?1:0,zone:dz,res,
        rx:res==="save"?tx:Z2X(dz)*1.12,
        ry:res==="save"?ty:(dz==="C"?1.9:1.2+Math.random()*0.5),
        short:res==="goal"&&dz===z, watch:res==="over",
        punch:res==="post"&&dz===z, catch:B.katch};
  sfxThud();
}
function ballImpact(now){
  const res=B.res;
  const I=vfxTier(B.force||VFX.force);
  vfxOnImpact(now, res);
  if(res==="goal"){
    FX.ripple={x:B.x,y:B.y,t0:now};
    B.netFrom={x:B.x,y:B.y,d:B.d};
    B.netTo={x:B.x*0.9,y:Math.min(B.y*0.55,0.75),d:M.DG+1.05};
    B.mode="net"; B.t0=now;
    sfxCheer(true); celebrate(null,3600);
    burstConfetti(Math.round(110+140*I));
    shake(5+10*I);
    FX.flashBurst=now+1700;
  }else if(res==="save"){
    if(B.katch){ B.mode="held"; }
    else{ B.mode="free"; B.vx=Math.sign(B.x||1)*2.6; B.vy=1.3; B.vd=-6.5; }
    sfxGroan(); dimStands(); celebrate(cyanCol,2200);
    shake(3+4*I);
  }else if(res==="post"){
    B.mode="free";
    if(B.zone==="C"){ B.vy=-Math.abs(B.vy)*0.4-1.6; B.vd=-4.4; B.vx*=0.3; }
    else{ B.vx=-Math.sign(B.x)*3.4; B.vd=-5.2; B.vy=Math.abs(B.vy)*0.25; }
    ringAt(W/2+B.x*sc(B.d),gy(B.d)-B.y*sc(B.d));
    FX.postHitT=now;
    sfxClang(); sfxGroan(); dimStands(); shake(3+5*I);
  }else{ // over
    B.mode="fly2";
    sfxGroan(); dimStands();
  }
}
function updateBall(now,dt){
  const m=B.mode;
  if(m==="rollin"){
    const t=ez((now-B.t0)/800);
    B.x=lerp(2.6,0,t); B.d=lerp(4.1,M.DSPOT,t); B.y=0.11; B.rot-=dt*9*(1-t*0.7);
    if(t>=1) B.mode="rest";
  }else if(m==="windup"){
    B.x=0; B.y=0.11; B.d=M.DSPOT;
    if(now>=(B.tFly||B.t0)) B.mode="fly";
  }else if(m==="fly"){
    B.vx+=B.curve*dt; B.vy-=9.8*dt;
    B.x+=B.vx*dt; B.y+=B.vy*dt; B.d+=B.vd*dt; B.rot+=dt*14;
    if(now>=B.tImpact) ballImpact(now);
  }else if(m==="fly2"){
    B.vy-=9.8*dt; B.x+=B.vx*dt; B.y+=B.vy*dt; B.d+=B.vd*dt; B.rot+=dt*10;
    if(B.d>M.DG+4.6||B.y<0){
      FX.flashes.push({x:W/2+B.x*sc(B.d),y:gy(B.d)-B.y*sc(B.d),t0:now});
      B.mode="gone";
    }
  }else if(m==="net"){
    const t=ez((now-B.t0)/360);
    B.x=lerp(B.netFrom.x,B.netTo.x,t);
    B.y=lerp(B.netFrom.y,B.netTo.y,t);
    B.d=lerp(B.netFrom.d,B.netTo.d,t);
    if(t>=1){ B.mode="free"; B.vx=0; B.vy=0; B.vd=-0.4; }
  }else if(m==="free"){
    B.vy-=9.8*dt; B.x+=B.vx*dt; B.y+=B.vy*dt; B.d+=B.vd*dt;
    B.rot+=(Math.abs(B.vx)+Math.abs(B.vd))*dt*2;
    if(B.y<0.11&&B.vy<0){ B.y=0.11; B.vy*=-0.42; B.vx*=0.78; B.vd*=0.78; }
    if(B.d<3.0){ B.d=3.0; B.vd=0; } else if(B.d>M.DG+1.4){ B.d=M.DG+1.4; B.vd=0; }
    if(B.y<=0.12&&Math.hypot(B.vx,B.vd)<0.5) B.mode="rest";
  }else if(m==="held"){
    B.x=(KS.hlx+KS.hrx)/2; B.y=Math.max(0.14,(KS.hly+KS.hry)/2); B.d=M.DK-0.3;
  }
  // Long trail while the ball flies toward / past the goal.
  if(m==="fly"||m==="fly2"||m==="net"||(m==="free"&&Math.hypot(B.vx,B.vd)>1.2)){
    const s=sc(B.d);
    B.trail.push({x:W/2+B.x*s,y:gy(B.d)-B.y*s,r:Math.max(4,0.11*s)});
    if(B.trail.length>28) B.trail.shift();
  }else if(B.trail.length) B.trail.shift();
}
function drawFlightGuide(){
  // Predicted path from spot → impact while the ball is flying.
  if((B.mode!=="fly"&&B.mode!=="windup")||!B.T) return;
  const n=18;
  cx.save();
  cx.setLineDash([6,8]);
  cx.strokeStyle="rgba(255,196,0,.35)";
  cx.lineWidth=Math.max(1.5,H*0.0025);
  cx.beginPath();
  for(let i=0;i<=n;i++){
    const u=i/n, t=B.T*u;
    const x=0+B.vx*t+0.5*B.curve*t*t;
    const y=0.11+B.vy*t-4.9*t*t;
    const d=M.DSPOT+B.vd*t;
    const s=sc(d), px=W/2+x*s, py=gy(d)-Math.max(0.05,y)*s;
    i?cx.lineTo(px,py):cx.moveTo(px,py);
  }
  cx.stroke();
  cx.restore();
}
function drawBall(){
  if(B.mode==="gone") return;
  const s=sc(B.d), x=W/2+B.x*s, y=gy(B.d)-B.y*s, r=Math.max(4,0.11*s);
  const I=vfxTier(B.force||VFX.force);

  if(B.trail.length>1){
    cx.save();

    cx.strokeStyle=drive?`rgba(255,${Math.round(180+40*I)},80,${0.45+0.25*I})`
      :`rgba(180,220,255,${0.4+0.2*I})`;

    for(let i=0;i<B.trail.length;i++){

      i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y);
    }

  }
  for(let i=0;i<B.trail.length;i++){                     // motion blur
    const p=B.trail[i], a=(i+1)/B.trail.length*0.38;
    cx.fillStyle=`rgba(244,247,241,${a})`;
    cx.beginPath(); cx.arc(p.x,p.y,p.r*(0.45+0.5*(i+1)/B.trail.length),0,7); cx.fill();
  }
  cx.fillStyle=`rgba(4,12,6,${clamp(0.34-B.y*0.16,0.05,0.34)})`;   // shadow
  cx.beginPath(); cx.ellipse(x,gy(B.d),r*1.05,r*0.3,0,0,7); cx.fill();
  const g=cx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.15,x,y,r);
  g.addColorStop(0,"#ffffff"); g.addColorStop(0.75,"#e8eef0"); g.addColorStop(1,"#b9c6cc");
  cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill();
  cx.strokeStyle="rgba(20,40,50,.4)"; cx.lineWidth=Math.max(1,r*0.08); cx.stroke();
  cx.fillStyle="#25353d";
  for(let k=0;k<5;k++){                                   // rolling panel dots
    const a=B.rot+k*Math.PI*2/5;
    cx.beginPath(); cx.arc(x+Math.cos(a)*r*0.55,y+Math.sin(a)*r*0.52,r*0.17,0,7); cx.fill();
  }
  cx.beginPath(); cx.arc(x+Math.cos(B.rot*1.6)*r*0.15,y+Math.sin(B.rot*1.6)*r*0.15,r*0.19,0,7); cx.fill();
}

/* ============================== goal + net ============================== */
function netOfs(nx,ny,now){                 // ripple displacement for node (metres)
  if(!FX.ripple) return [0,0];
  const ph=(now-FX.ripple.t0)/1000;
  if(ph>1.4){ FX.ripple=null; return [0,0]; }
  const dx=nx-FX.ripple.x, dy=ny-FX.ripple.y, dist=Math.hypot(dx,dy);
  const a=0.17*Math.exp(-dist*1.5-ph*3.2)*Math.sin(dist*7-ph*24);
  const inv=dist<0.001?0:1/dist;
  return [a*dx*inv,a*dy*inv];
}
function netP(nx,ny,nd,now){
  const [ox,oy]=netOfs(nx,ny,now);
  const s=sc(nd);
  return [W/2+(nx+ox)*s, gy(nd)-(ny+oy)*s];
}
function drawNet(now){
  const NU=14,NV=7, dTop=M.DG+0.45, dBot=M.DG+1.35, hTop=2.3;
  cx.strokeStyle="rgba(235,245,250,.30)";
  cx.lineWidth=Math.max(1,0.9*H/900);
  cx.beginPath();
  for(let i=0;i<=NU;i++){                       // back-panel verticals (sampled for ripple)
    const nx=-3.6+7.2*i/NU;
    for(let j=0;j<=NV;j++){
      const v=j/NV, ny=hTop*(1-v), nd=lerp(dTop+0.85,dBot,v);
      const [px,py]=netP(nx,ny,nd,now);
      j?cx.lineTo(px,py):cx.moveTo(px,py);
    }
  }
  for(let j=0;j<=NV;j++){                       // back-panel horizontals
    const v=j/NV, ny=hTop*(1-v), nd=lerp(dTop+0.85,dBot,v);
    for(let i=0;i<=NU;i++){
      const nx=-3.6+7.2*i/NU;
      const [px,py]=netP(nx,ny,nd,now);
      i?cx.lineTo(px,py):cx.moveTo(px,py);
    }
  }
  for(let i=0;i<=NU;i+=1){                      // roof of the net
    const nx=-3.6+7.2*i/NU;
    const [ax,ay]=netP(nx*1.016,M.GH-0.06,M.DG+0.06,now);
    const [bx,by]=netP(nx,hTop,dTop+0.85,now);
    cx.moveTo(ax,ay); cx.lineTo(bx,by);
  }
  for(let j=0;j<=4;j++){                        // side panels
    const ny=j*0.55;
    for(const sgn of [-1,1]){
      const [ax,ay]=netP(sgn*3.63,ny,M.DG+0.05,now);
      const [bx,by]=netP(sgn*3.6,Math.min(ny,hTop),dBot,now);
      cx.moveTo(ax,ay); cx.lineTo(bx,by);
    }
  }
  cx.stroke();
  // stanchions
  cx.strokeStyle="rgba(230,240,246,.55)"; cx.lineWidth=Math.max(1.5,0.05*sc(M.DG));
  cx.beginPath();
  for(const sgn of [-1,1]){
    cx.moveTo(PXX(sgn*3.66,M.DG),BARY);
    cx.lineTo(PXX(sgn*3.6,dBot),gy(dBot));
  }
  cx.stroke();
}
function drawFrame(now){
  const q=(now-FX.postHitT)/450;
  const wob=(q>=0&&q<1)?Math.sin(q*32)*(1-q)*W*0.0015:0;
  const pw=Math.max(4,0.12*sc(M.DG));

  const g2=cx.createLinearGradient(GRX,0,GRX+pw,0);
  g2.addColorStop(0,"#ffffff"); g2.addColorStop(0.55,"#eef4f6"); g2.addColorStop(1,"#aebfc7");

  cx.fillStyle=g3;

/* ============================== the keeper ============================== */
const KS={x:0,hy:0.95,sp:0,hlx:-0.48,hly:0.78,hrx:0.48,hry:0.78,
          flx:-0.2,fly:0,frx:0.2,fry:0,look:0,up:0};
let dive=null;
function ik(ax,ay,tx,ty,l1,l2,sign){
  let dx=tx-ax,dy=ty-ay,d=Math.hypot(dx,dy)||1e-4;
  const cl=Math.min(d,(l1+l2)*0.999);
  dx*=cl/d; dy*=cl/d;
  const hx=ax+dx, hy=ay+dy;
  const cosA=clamp((l1*l1+cl*cl-l2*l2)/(2*l1*cl),-1,1);
  const a=Math.acos(cosA), base=Math.atan2(dy,dx);
  return [ax+Math.cos(base+sign*a)*l1, ay+Math.sin(base+sign*a)*l1, hx, hy];
}
function keeperTargets(now){
  const t=now/1000, ph=S?.phase||"lobby";
  const aim=S?.aimLive||"C", ad=aim==="L"?-1:aim==="R"?1:0;
  const T={r:0.14,up:0};
  if(ph==="resolve"&&dive){ diveTargets(T,now); return T; }
  if(ph==="end"&&S){
    if(S.score>S.kicksTotal/2){          // beaten: slump on knees
      T.x=0; T.hy=0.45; T.sp=0; T.up=-0.7;
      T.hlx=-0.34; T.hly=0.28; T.hrx=0.34; T.hry=0.28;
      T.flx=-0.24; T.fly=0; T.frx=0.24; T.fry=0;
      T.look=0; return T;
    }
    const b=Math.max(0,Math.sin(t*4.6));  // keeper won: bouncing celebration
    T.x=Math.sin(t*0.9)*0.3; T.hy=0.95+b*0.34; T.sp=Math.sin(t*2)*0.06; T.up=0.6;
    T.hlx=T.x-0.5; T.hly=1.95+b*0.25; T.hrx=T.x+0.5; T.hry=1.95+b*0.25;
    const fl=Math.max(0,T.hy-0.95);
    T.flx=T.x-0.2; T.fly=fl*0.9; T.frx=T.x+0.2; T.fry=fl*0.75;
    T.look=Math.sin(t*1.3); return T;
  }
  if(ph==="announce"||ph==="countdown"||ph==="shoot"){
    const crouch=ph==="announce"?0.42:ph==="countdown"?0.56:0.66;
    const jit=ph==="countdown"?Math.sin(t*9.3)*0.03+Math.sin(t*13.7)*0.02:
              ph==="shoot"?Math.sin(t*24)*0.008:Math.sin(t*2.2)*0.04;
    T.x=ad*0.55+jit; T.hy=0.95-crouch*0.36; T.sp=ad*(0.10+crouch*0.10);
    const w=0.62+crouch*0.34, hh=1.02-crouch*0.22;
    T.hlx=T.x-w; T.hly=hh; T.hrx=T.x+w; T.hry=hh;
    T.flx=T.x-(0.26+crouch*0.22); T.frx=T.x+(0.26+crouch*0.22); T.fly=0; T.fry=0;
    T.look=ad; T.r=ph==="shoot"?0.2:0.14;
    return T;
  }
  // lobby / default: weight-shifting sway, glove claps, the odd stretch
  const sway=Math.sin(t*0.8);
  T.x=sway*0.28; T.hy=0.95+Math.abs(Math.sin(t*2.2))*0.03; T.sp=sway*0.05;
  const stretch=Math.sin(t*0.31)>0.93, clap=Math.sin(t*0.83)>0.985;
  if(stretch){ T.hlx=T.x-0.32; T.hly=1.95; T.hrx=T.x+0.32; T.hry=1.95; }
  else if(clap){ T.hlx=T.x-0.08; T.hly=1.05; T.hrx=T.x+0.08; T.hry=1.05; }
  else { T.hlx=T.x-0.48; T.hly=0.78; T.hrx=T.x+0.48; T.hry=0.78; }
  T.flx=T.x-0.22; T.fly=0; T.frx=T.x+0.22; T.fry=0; T.look=sway*0.5;
  return T;
}
function diveTargets(T,now){
  const t=(now-dive.t0)/1000, d=dive.dir;
  T.r=0.5;
  if(dive.watch){                                       // skied — just watch it sail over
    T.x=0; T.up=0.9; T.look=0; T.sp=0;
    T.hy=0.95+(t>0.2&&t<0.5?Math.sin((t-0.2)/0.3*Math.PI)*0.1:0);
    T.hlx=-0.42; T.hly=0.75; T.hrx=0.42; T.hry=0.75;
    T.flx=-0.2; T.fly=0; T.frx=0.2; T.fry=0;
    return;
  }
  const short=dive.short?0.5:0;
  const rx=dive.rx-Math.sign(dive.rx||1)*short;
  const ry=Math.max(0.3,dive.ry-(dive.short?0.3:0));
  if(d===0){                                            // centre: vertical spring
    const p=ez((t-0.06)/0.36), land=ez((t-0.5)/0.3);
    const up=t<0.5?Math.sin(p*Math.PI)*(0.3+(ry>1.5?0.35:0)):0;
    T.x=0; T.hy=0.95+up-(t>=0.5?land*0.25*(1-ez((t-1.4)/0.8)):0); T.sp=0; T.up=0.4;
    T.hlx=rx-0.16; T.hly=ry; T.hrx=rx+0.16; T.hry=ry;
    if(t>1.4){ const u=ez((t-1.4)/0.8);
      T.hlx=lerp(rx-0.16,-0.48,u); T.hly=lerp(ry,0.78,u);
      T.hrx=lerp(rx+0.16,0.48,u); T.hry=lerp(ry,0.78,u); T.hy=lerp(T.hy,0.95,u); }
    const fl=Math.max(0,T.hy-0.95);
    T.flx=-0.18; T.fly=fl*0.85; T.frx=0.18; T.fry=fl*0.7;
    T.look=0; return;
  }
  const T1=0.10,T2=0.46,T3=0.8,T4=1.75,T5=2.6;
  let x,hy,sp,hl,hr;
  if(t<T1){ const p=t/T1;
    x=d*0.05; hy=0.95-0.33*p; sp=d*0.10*p;
    hl=[x-0.62,1.0]; hr=[x+0.62,1.0];
  }else if(t<T2){ const p=ez((t-T1)/(T2-T1));
    x=d*(0.1+1.25*p); hy=0.60+Math.sin(p*Math.PI)*0.5-p*0.06; sp=d*(0.15+1.15*p);
    const lead=[rx,ry], trail=dive.punch?[x,0.55]:[rx-d*0.5,Math.max(0.2,ry-0.3)];
    hl=d<0?lead:trail; hr=d<0?trail:lead;
  }else if(t<T3){ const p=ez((t-T2)/(T3-T2));
    x=d*(1.35+0.3*p); hy=lerp(0.55,0.30,p); sp=d*lerp(1.3,1.46,p);
    const lead=[x+d*0.85,0.34], trail=[x+d*0.4,0.30];
    hl=d<0?lead:trail; hr=d<0?trail:lead;
  }else if(t<T4){
    x=d*1.65; hy=0.30; sp=d*1.46;
    const lead=dive.catch?[x+d*0.55,0.34]:[x+d*0.85,0.32], trail=[x+d*0.4,0.28];
    hl=d<0?lead:trail; hr=d<0?trail:lead;
  }else if(t<T5){ const u=ez((t-T4)/(T5-T4));
    x=d*lerp(1.65,1.45,u); hy=lerp(0.30,0.95,u); sp=d*lerp(1.46,0,u);
    hl=[x-0.48*u-(1-u)*(-d)*0.4,lerp(0.3,0.78,u)];
    hr=[x+0.48*u+(1-u)*d*0.4,lerp(0.3,0.78,u)];
  }else{ const u=ez((t-T5)/1.3);
    x=lerp(d*1.45,0,u); hy=0.95+Math.abs(Math.sin(t*5))*0.02*u; sp=0;
    hl=[x-0.48,0.78]; hr=[x+0.48,0.78];
  }
  T.x=x; T.hy=hy; T.sp=sp;
  T.hlx=hl[0]; T.hly=hl[1]; T.hrx=hr[0]; T.hry=hr[1];
  T.look=d;
  // feet from spine
  const fdx=-Math.sin(sp), fdy=-Math.cos(sp);
  T.flx=x+fdx*0.62-0.13*Math.abs(Math.cos(sp)); T.fly=Math.max(0.03,hy+fdy*0.80);
  T.frx=x+fdx*0.92+0.13*Math.abs(Math.cos(sp)); T.fry=Math.max(0.03,hy+fdy*0.94);
  if(Math.abs(sp)<0.35&&hy>0.8){ T.fly=0; T.fry=0; T.flx=x-0.22; T.frx=x+0.22; }
}
/* ============================== striker (penalty taker) ============================== */
const SS={x:0.05,hy:0.92,sp:0.04,look:0,up:0,
  hlx:-0.28,hly:1.22,hrx:0.30,hry:1.20,
  flx:-0.18,fly:0,frx:0.20,fry:0,
  foot:"R",phase:"idle",t0:0,T:0.7,zone:"C",power:0.5,dirDeg:0};
function strikerKick(last,t0,T){
  const z=last.zone||"C", power=last.power??0.5;
  const dir=typeof last.dirDeg==="number"?last.dirDeg:0;
  // Foot from swing direction / zone (ForcePose dirDeg: + = rightward).
  const foot=(Math.abs(dir)>18?(dir>0?"L":"R"):(z==="L"?"R":"L"));
  Object.assign(SS,{foot,phase:"kick",t0,T:Math.max(0.4,T),
    zone:z,power,dirDeg:dir,look:z==="L"?-0.35:z==="R"?0.35:0});
}
function strikerReset(){
  Object.assign(SS,{phase:"idle",foot:"R",look:0,up:0,x:0.05,hy:0.92,sp:0.04,
    hlx:-0.28,hly:1.22,hrx:0.30,hry:1.20,flx:-0.18,fly:0,frx:0.20,fry:0});
}
function strikerTargets(now){
  const ph=S?.phase||"lobby";
  const T={x:0.08,hy:0.90,sp:0.05,look:0,up:0,
    hlx:-0.26,hly:1.18,hrx:0.28,hry:1.16,
    flx:-0.16,fly:0,frx:0.18,fry:0,r:0.16};
  if(ph==="lobby"||ph==="end"){
    T.hy=0.93+Math.sin(now/520)*0.01; T.look=Math.sin(now/900)*0.08; return T;
  }
  // Approach / plant during countdown & shoot window.
  if(ph==="announce"||ph==="countdown"||ph==="shoot"){
    const run=ph==="announce"?0:ph==="countdown"?0.35:0.7;
    T.x=lerp(0.55,0.06,run); T.hy=0.90; T.sp=0.08;
    T.hlx=-0.22; T.hly=1.25; T.hrx=0.34; T.hry=1.10;
    T.flx=-0.12; T.frx=0.22;
    if(S?.aimLive==="L") T.look=-0.25; else if(S?.aimLive==="R") T.look=0.25;
    return T;
  }
  if(SS.phase==="kick"){
    const u=clamp((now-SS.t0)/(SS.T*1000),0,1);
    const kickFoot=SS.foot==="R"?1:-1;
    const aim=SS.zone==="L"?-1:SS.zone==="R"?1:0;
    if(u<0.22){ // plant + load
      const v=ez(u/0.22);
      T.x=0.04; T.hy=lerp(0.90,0.78,v); T.sp=0.12*kickFoot;
      T.look=aim*0.4; T.up=-0.05;
      // plant foot stays; kicking foot draws back
      if(SS.foot==="R"){
        T.flx=-0.10; T.fly=0; T.frx=0.35; T.fry=0.35+0.15*v;
        T.hlx=-0.35; T.hly=1.05; T.hrx=0.45; T.hry=1.35;
      }else{
        T.frx=0.10; T.fry=0; T.flx=-0.35; T.fly=0.35+0.15*v;
        T.hrx=0.35; T.hry=1.05; T.hlx=-0.45; T.hly=1.35;
      }
      T.r=0.35; return T;
    }
    if(u<0.48){ // swing through the ball
      const v=ez((u-0.22)/0.26);
      T.x=0.02; T.hy=lerp(0.78,0.86,v); T.sp=-0.18*kickFoot+aim*0.08;
      T.look=aim*0.55; T.up=0.08*v;
      if(SS.foot==="R"){
        T.flx=-0.08; T.fly=0;
        T.frx=lerp(0.35,-0.05,v); T.fry=lerp(0.50,0.08,v);
        T.hlx=-0.40; T.hly=1.15; T.hrx=0.20; T.hry=1.40;
      }else{
        T.frx=0.08; T.fry=0;
        T.flx=lerp(-0.35,0.05,v); T.fly=lerp(0.50,0.08,v);
        T.hrx=0.40; T.hry=1.15; T.hlx=-0.20; T.hly=1.40;
      }
      T.r=0.55; return T;
    }
    // follow-through / hold
    const v=ez(clamp((u-0.48)/0.52,0,1));
    T.x=-0.02+aim*0.04; T.hy=lerp(0.86,0.92,v); T.sp=-0.10*kickFoot;
    T.look=aim*0.3; T.up=0.04;
    if(SS.foot==="R"){
      T.flx=-0.05; T.fly=0; T.frx=-0.15; T.fry=0.55*(1-v*0.35);
      T.hlx=-0.30; T.hly=1.25; T.hrx=0.15; T.hry=1.45;
    }else{
      T.frx=0.05; T.fry=0; T.flx=0.15; T.fly=0.55*(1-v*0.35);
      T.hrx=0.30; T.hry=1.25; T.hlx=-0.15; T.hly=1.45;
    }
    T.r=0.22;
    if(u>=1) SS.phase="hold";
    return T;
  }
  // hold pose after kick
  T.x=-0.02; T.hy=0.92; T.sp=SS.foot==="R"?-0.08:0.08;
  T.look=SS.zone==="L"?-0.2:SS.zone==="R"?0.2:0;
  if(SS.foot==="R"){ T.flx=-0.05; T.frx=-0.12; T.fry=0.35; }
  else { T.frx=0.05; T.flx=0.12; T.fly=0.35; }
  return T;
}
/* Solid stylized athlete — filled capsules/torso, not stroke sticks. */
function drawCapsule(x0,y0,x1,y1,r0,r1,fill,stroke){
  const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy)||1e-4;
  const nx=-dy/len, ny=dx/len;
  cx.beginPath();
  cx.moveTo(x0+nx*r0,y0+ny*r0);
  cx.lineTo(x1+nx*r1,y1+ny*r1);
  cx.arc(x1,y1,r1,Math.atan2(ny,nx),Math.atan2(-ny,-nx),false);
  cx.lineTo(x0-nx*r0,y0-ny*r0);
  cx.arc(x0,y0,r0,Math.atan2(-ny,-nx),Math.atan2(ny,nx),false);
  cx.closePath();
  cx.fillStyle=fill; cx.fill();
  if(stroke){ cx.strokeStyle=stroke; cx.lineWidth=Math.max(1,Math.min(r0,r1)*0.22); cx.stroke(); }
}
function drawPerson(now,dt,state,targets,depth,kit,opt){
  const r=clamp((targets.r||0.14)*dt*60,0,1);
  for(const k of ["x","hy","sp","hlx","hly","hrx","hry","flx","fly","frx","fry","look","up"])
    state[k]+=((targets[k]!==undefined?targets[k]:state[k])-state[k])*r;
  // World metres → px; cap on-screen height so near-camera figures don't eat the frame.
  let s=sc(depth);
  const maxH=(opt&&opt.maxH)||H*0.46;
  if(1.85*s>maxH) s=maxH/1.85;
  const gnd=gy(depth);
  const X=v=>W/2+v*s, Y=v=>gnd-v*s;
  const sp=state.sp, dirx=Math.sin(sp), diry=Math.cos(sp);
  const hip=[state.x,state.hy];
  const chest=[hip[0]+dirx*0.52,hip[1]+diry*0.52];
  const neck=[chest[0]+dirx*0.18,chest[1]+diry*0.18];
  const head=[chest[0]+dirx*0.36+state.look*0.07,chest[1]+diry*0.36+state.up*0.05];
  const px_=[diry,-dirx];
  const shl=[chest[0]-px_[0]*0.26,chest[1]-px_[1]*0.26];
  const shr=[chest[0]+px_[0]*0.26,chest[1]+px_[1]*0.26];
  const hpl=[hip[0]-px_[0]*0.15,hip[1]-px_[1]*0.15];
  const hpr=[hip[0]+px_[0]*0.15,hip[1]+px_[1]*0.15];
  const sL=state.hly>shl[1]+0.05?-1:1, sR=state.hry>shr[1]+0.05?1:-1;
  const armL=ik(shl[0],shl[1],state.hlx,state.hly,0.34,0.32,sL);
  const armR=ik(shr[0],shr[1],state.hrx,state.hry,0.34,0.32,sR);
  const kSign=Math.abs(sp)>0.5?(sp>0?1:-1):0;
  const legL=ik(hpl[0],hpl[1],state.flx,state.fly+0.08,0.46,0.44,kSign||-1);
  const legR=ik(hpr[0],hpr[1],state.frx,state.fry+0.08,0.46,0.44,kSign||1);
  const ink="rgba(8,16,24,.55)";
  const air=Math.max(0,Math.min(state.fly,state.fry));
  cx.fillStyle=`rgba(4,12,6,${clamp(0.40-air*0.4,0.10,0.40)})`;
  cx.beginPath();
  cx.ellipse(X(hip[0]+dirx*0.2),gnd,(0.42+Math.abs(dirx)*0.4)*s,0.11*s,0,0,7);
  cx.fill();

  // Thighs (shorts) + calves (socks) as solid tapered capsules.
  const thighW=0.11*s, kneeW=0.09*s, ankleW=0.07*s;
  for(const L of [[hpl,legL],[hpr,legR]]){
    const hipP=L[0], mid=[L[1][0],L[1][1]], foot=[L[1][2],L[1][3]];
    drawCapsule(X(hipP[0]),Y(hipP[1]),X(mid[0]),Y(mid[1]),thighW,kneeW,kit.shortFill,ink);
    drawCapsule(X(mid[0]),Y(mid[1]),X(foot[0]),Y(foot[1]),kneeW*0.95,ankleW,kit.sock,ink);
    // boot
    const ang=Math.atan2(Y(foot[1])-Y(mid[1]),X(foot[0])-X(mid[0]));
    cx.save();
    cx.translate(X(foot[0]),Y(foot[1])+0.02*s);
    cx.rotate(ang*0.35-sp*0.25);
    cx.fillStyle=kit.boot;
    cx.beginPath(); cx.ellipse(0.04*s,0,0.15*s,0.07*s,0,0,7); cx.fill();
    cx.fillStyle=kit.bootToe||"#2a3340";
    cx.beginPath(); cx.ellipse(0.12*s,0.01*s,0.07*s,0.05*s,0,0,7); cx.fill();
    cx.restore();
  }

  // Torso — rounded jersey body
  const shoulderW=0.30, waistW=0.20;
  const tUL=[shl[0]-px_[0]*0.08,shl[1]-px_[1]*0.08];
  const tUR=[shr[0]+px_[0]*0.08,shr[1]+px_[1]*0.08];
  const tLR=[hpr[0]+px_[0]*0.06-dirx*0.06,hpr[1]+px_[1]*0.06-diry*0.06];
  const tLL=[hpl[0]-px_[0]*0.06-dirx*0.06,hpl[1]-px_[1]*0.06-diry*0.06];
  const tg=cx.createLinearGradient(X(tUL[0]),Y(tUL[1]),X(tLR[0]),Y(tLR[1]));
  tg.addColorStop(0,kit.jersey0); tg.addColorStop(0.55,kit.jersey1); tg.addColorStop(1,kit.jersey2);
  cx.beginPath();
  cx.moveTo(X(tUL[0]),Y(tUL[1]));
  cx.quadraticCurveTo(X(chest[0]+dirx*0.08),Y(chest[1]+diry*0.08)-0.02*s,X(tUR[0]),Y(tUR[1]));
  cx.lineTo(X(tLR[0]),Y(tLR[1]));
  cx.quadraticCurveTo(X(hip[0]-dirx*0.05),Y(hip[1]-diry*0.02),X(tLL[0]),Y(tLL[1]));
  cx.closePath();
  cx.fillStyle=tg; cx.fill();
  cx.strokeStyle=ink; cx.lineWidth=Math.max(1.2,0.02*s); cx.stroke();

  // Shorts overlay
  cx.beginPath();
  cx.moveTo(X(hpl[0]-px_[0]*0.08),Y(hpl[1]-px_[1]*0.02));
  cx.lineTo(X(hpr[0]+px_[0]*0.08),Y(hpr[1]-px_[1]*0.02));
  cx.lineTo(X(hpr[0]+px_[0]*0.04-dirx*0.28),Y(hpr[1]+px_[1]*0.04-diry*0.28));
  cx.lineTo(X(hpl[0]-px_[0]*0.04-dirx*0.28),Y(hpl[1]-px_[1]*0.04-diry*0.28));
  cx.closePath();
  cx.fillStyle=kit.shortFill; cx.fill();

  // Jersey number / label
  if(kit.num&&s>28){
    cx.save();
    cx.translate(X((chest[0]+hip[0])/2),Y((chest[1]+hip[1])/2+0.04));
    cx.rotate(sp);
    cx.fillStyle=kit.labelCol; cx.textAlign="center"; cx.textBaseline="middle";
    if(kit.label&&s>48){
      cx.font=`700 ${Math.max(6,0.075*s)}px ${FCND}`;
      cx.fillText(kit.label,0,-0.10*s);
    }
    cx.font=`900 ${Math.max(10,0.22*s)}px ${FBLK}`;
    cx.fillText(kit.num,0,0.06*s);
    cx.restore();
  }

  // Arms — upper sleeve + forearm
  const armUW=0.085*s, armLW=0.065*s, wristW=0.055*s;
  for(const [sh,arm,colU,colL] of [
    [shl,armL,kit.sleeve,kit.skin],[shr,armR,kit.sleeveHi,kit.skin]
  ]){
    const mid=[arm[0],arm[1]], hand=[arm[2],arm[3]];
    drawCapsule(X(sh[0]),Y(sh[1]),X(mid[0]),Y(mid[1]),armUW,armLW,colU,ink);
    drawCapsule(X(mid[0]),Y(mid[1]),X(hand[0]),Y(hand[1]),armLW*0.9,wristW,colL,ink);
    cx.fillStyle=kit.hand;
    cx.beginPath(); cx.ellipse(X(hand[0]),Y(hand[1]),0.075*s,0.065*s,sp*0.3,0,7); cx.fill();
    if(kit.gloveStroke){
      cx.strokeStyle=kit.gloveStroke; cx.lineWidth=Math.max(1,0.015*s); cx.stroke();
    }
  }

  // Neck + head
  drawCapsule(X(neck[0]),Y(neck[1]),X(head[0]),Y(head[1]-0.06),0.045*s,0.05*s,kit.skin,ink);
  const hx=X(head[0]), hy=Y(head[1]), hr=0.125*s;
  cx.fillStyle=kit.skin;
  cx.beginPath(); cx.ellipse(hx,hy,hr*0.92,hr,0,0,7); cx.fill();
  cx.strokeStyle=ink; cx.lineWidth=Math.max(1,0.016*s); cx.stroke();
  // hair cap
  cx.fillStyle=kit.hair;
  cx.beginPath();
  cx.ellipse(hx-dirx*hr*0.05,hy-hr*0.15,hr*0.95,hr*0.72,sp*0.2,Math.PI*1.05,Math.PI*1.95);
  cx.fill();
  // simple ear hints
  cx.fillStyle=kit.skin;
  cx.beginPath(); cx.ellipse(hx-hr*0.85,hy+hr*0.05,hr*0.18,hr*0.28,0,0,7); cx.fill();
  cx.beginPath(); cx.ellipse(hx+hr*0.85,hy+hr*0.05,hr*0.18,hr*0.28,0,0,7); cx.fill();
}
const KIT_STRIKER={
  jersey0:"#f7faf6",jersey1:"#e4ebe3",jersey2:"#c5d0c4",
  sleeve:"#e4ebe3",sleeveHi:"#f7faf6",short:"#1a2740",shortFill:"#152033",
  sock:"#e8b84a",boot:"#141a22",bootToe:"#2c3544",
  hand:"#d9a57a",skin:"#e0ad82",hair:"#2a1a12",
  label:"",labelCol:"#1a2740",num:"9"
};
const KIT_KEEPER={
  jersey0:"#7fe0ff",jersey1:"#3fc8f0",jersey2:"#1e8fbc",
  sleeve:"#2eb4e0",sleeveHi:"#5ad4f8",short:"#13273a",shortFill:"#0e1c28",
  sock:"#1a2740",boot:"#0a0f14",bootToe:"#1c2836",
  hand:"#f4f7f1",skin:"#e0ad82",hair:"#11161b",gloveStroke:"rgba(10,25,38,.55)",
  label:"THE WALL",labelCol:"#062028",num:"1"
};
/* ---- Option B: ForcePose skeleton → solid striker on the pitch ---- */
const MP={NOSE:0,L_SHO:11,R_SHO:12,L_ELB:13,R_ELB:14,L_WRI:15,R_WRI:16,
          L_HIP:23,R_HIP:24,L_KNE:25,R_KNE:26,L_ANK:27,R_ANK:28,L_FT:31,R_FT:32};
let poseKick=-1, poseT0=0;
function samplePoseFrame(now){
  const fr=S?.replay?.frames;
  if(!fr||fr.length<2) return null;
  if(S.replay.kick!==poseKick){ poseKick=S.replay.kick; poseT0=now; }
  const t0=fr[0].t, t1=fr[fr.length-1].t, span=t1-t0||1;
  // Play once slightly slowed so the kick reads; hold the last frame.
  const SLOW=1.65;
  const playT=t0+Math.min((now-poseT0)/SLOW, span);
  let f=fr[0];
  for(const g of fr){ if(g.t<=playT) f=g; else break; }
  return f;
}
function drawPoseStriker(now,frame){
  const p=frame.p;
  if(!p||!p[MP.L_HIP]||!p[MP.R_HIP]||!p[MP.L_ANK]||!p[MP.R_ANK]) return false;
  const depth=M.DSPOT-0.2;
  let s=sc(depth);
  const maxH=H*0.38;
  if(1.85*s>maxH) s=maxH/1.85;
  const gnd=gy(depth);
  // MediaPipe world: y down, x = person's right. TV sees their back → flip x.
  const footY=Math.max(
    p[MP.L_ANK][1], p[MP.R_ANK][1],
    p[MP.L_FT]?p[MP.L_FT][1]:-1e9, p[MP.R_FT]?p[MP.R_FT][1]:-1e9
  );
  const hipY=(p[MP.L_HIP][1]+p[MP.R_HIP][1])*0.5;
  const hipX=-(p[MP.L_HIP][0]+p[MP.R_HIP][0])*0.5;
  // Lateral bias toward aimed zone so they sit on the spot line.
  const aimBias=SS.zone==="L"?-0.12:SS.zone==="R"?0.12:0;
  const P=i=>{
    const q=p[i]; if(!q) return null;
    const lx=-q[0]-hipX+aimBias;          // centred on hips, rear view
    const ly=footY-q[1];                  // metres above planted feet
    return [W/2+lx*s, gnd-ly*s];
  };
  const need=[MP.L_SHO,MP.R_SHO,MP.L_HIP,MP.R_HIP,MP.L_KNE,MP.R_KNE,MP.L_ANK,MP.R_ANK];
  for(const i of need) if(!P(i)) return false;
  const kit=KIT_STRIKER, ink="rgba(8,16,24,.55)";
  // Ground shadow under ankles
  const aL=P(MP.L_ANK), aR=P(MP.R_ANK);
  cx.fillStyle="rgba(4,12,6,.35)";
  cx.beginPath();
  cx.ellipse((aL[0]+aR[0])/2,gnd,Math.max(18,0.38*s),Math.max(5,0.10*s),0,0,7);
  cx.fill();

  const seg=(ia,ib,r0,r1,col)=>{
    const A=P(ia), B=P(ib); if(!A||!B) return;
    drawCapsule(A[0],A[1],B[0],B[1],r0,r1,col,ink);
  };
  // Legs: thigh (shorts) + calf (sock)
  seg(MP.L_HIP,MP.L_KNE,0.11*s,0.09*s,kit.shortFill);
  seg(MP.R_HIP,MP.R_KNE,0.11*s,0.09*s,kit.shortFill);
  seg(MP.L_KNE,MP.L_ANK,0.085*s,0.065*s,kit.sock);
  seg(MP.R_KNE,MP.R_ANK,0.085*s,0.065*s,kit.sock);
  // Boots
  for(const [ia,ift] of [[MP.L_ANK,MP.L_FT],[MP.R_ANK,MP.R_FT]]){
    const A=P(ia), F=ift!=null&&p[ift]?P(ift):null;
    const tip=F||[A[0],A[1]+0.04*s];
    cx.fillStyle=kit.boot;
    cx.beginPath(); cx.ellipse((A[0]+tip[0])/2,(A[1]+tip[1])/2+0.01*s,0.12*s,0.065*s,0,0,7); cx.fill();
  }
  // Torso jersey from shoulders→hips
  const LS=P(MP.L_SHO), RS=P(MP.R_SHO), LH=P(MP.L_HIP), RH=P(MP.R_HIP);
  const tg=cx.createLinearGradient(LS[0],LS[1],RH[0],RH[1]);
  tg.addColorStop(0,kit.jersey0); tg.addColorStop(0.55,kit.jersey1); tg.addColorStop(1,kit.jersey2);
  cx.beginPath();
  cx.moveTo(LS[0],LS[1]); cx.lineTo(RS[0],RS[1]);
  cx.lineTo(RH[0],RH[1]); cx.lineTo(LH[0],LH[1]);
  cx.closePath(); cx.fillStyle=tg; cx.fill();
  cx.strokeStyle=ink; cx.lineWidth=Math.max(1.2,0.02*s); cx.stroke();
  // Shorts band
  cx.beginPath();
  cx.moveTo(LH[0],LH[1]); cx.lineTo(RH[0],RH[1]);
  const midH=[(LH[0]+RH[0])/2,(LH[1]+RH[1])/2];
  const midK=P(MP.L_KNE), midK2=P(MP.R_KNE);
  cx.lineTo(midK2[0]*0.35+RH[0]*0.65, midK2[1]*0.35+RH[1]*0.65);
  cx.lineTo(midK[0]*0.35+LH[0]*0.65, midK[1]*0.35+LH[1]*0.65);
  cx.closePath(); cx.fillStyle=kit.shortFill; cx.fill();
  // Number
  if(s>28){
    cx.save();
    cx.translate((LS[0]+RS[0]+LH[0]+RH[0])/4,(LS[1]+RS[1]+LH[1]+RH[1])/4);
    cx.fillStyle=kit.labelCol; cx.textAlign="center"; cx.textBaseline="middle";
    cx.font=`900 ${Math.max(10,0.20*s)}px ${FBLK}`;
    cx.fillText(kit.num,0,0);
    cx.restore();
  }
  // Arms
  seg(MP.L_SHO,MP.L_ELB,0.08*s,0.065*s,kit.sleeve);
  seg(MP.R_SHO,MP.R_ELB,0.08*s,0.065*s,kit.sleeveHi);
  if(p[MP.L_WRI]) seg(MP.L_ELB,MP.L_WRI,0.06*s,0.05*s,kit.skin);
  if(p[MP.R_WRI]) seg(MP.R_ELB,MP.R_WRI,0.06*s,0.05*s,kit.skin);
  for(const iw of [MP.L_WRI,MP.R_WRI]){
    const Hnd=P(iw); if(!Hnd) continue;
    cx.fillStyle=kit.hand;
    cx.beginPath(); cx.ellipse(Hnd[0],Hnd[1],0.07*s,0.06*s,0,0,7); cx.fill();
  }
  // Head from nose / mid-shoulder
  const nose=P(MP.NOSE);
  const midS=[(LS[0]+RS[0])/2,(LS[1]+RS[1])/2];
  const hx=nose?nose[0]:midS[0], hy=nose?nose[1]:midS[1]-0.22*s;
  const hr=0.12*s;
  drawCapsule(midS[0],midS[1],hx,hy+hr*0.3,0.04*s,0.045*s,kit.skin,ink);
  cx.fillStyle=kit.skin;
  cx.beginPath(); cx.ellipse(hx,hy,hr*0.9,hr,0,0,7); cx.fill();
  cx.strokeStyle=ink; cx.lineWidth=Math.max(1,0.015*s); cx.stroke();
  cx.fillStyle=kit.hair;
  cx.beginPath(); cx.ellipse(hx,hy-hr*0.2,hr*0.92,hr*0.65,0,Math.PI*1.05,Math.PI*1.95); cx.fill();
  // Tiny "YOU" cue while pose-driven
  cx.fillStyle="rgba(255,196,0,.85)";
  cx.font=`800 ${Math.max(10,H*0.016)}px ${FCND}`;
  cx.textAlign="center";
  cx.fillText("YOUR KICK · FORCEPOSE",W/2,gnd+Math.max(14,H*0.022));
  return true;
}
function drawStriker(now,dt){
  const ph=S?.phase||"lobby";
  if(ph==="lobby"||ph==="end") return;
  // Option B: when bullet-time frames land, drive the pitch striker from your skeleton.
  if(ph==="resolve"){
    const f=samplePoseFrame(now);
    if(f&&drawPoseStriker(now,f)) return;
  }
  // Fallback A: stylized approach / procedural kick until replay arrives.
  drawPerson(now,dt,SS,strikerTargets(now),M.DSPOT-0.2,KIT_STRIKER,{maxH:H*0.38});
}
function drawKeeper(now,dt){
  drawPerson(now,dt,KS,keeperTargets(now),M.DK,KIT_KEEPER,{maxH:H*0.34});
}

/* ============================== aim reticle ============================== */
function drawGoalShadow(){
  const g=cx.createLinearGradient(0,BARY,0,GY);
  g.addColorStop(0,"rgba(2,8,14,.44)"); g.addColorStop(1,"rgba(2,8,14,.14)");
  cx.fillStyle=g; cx.fillRect(GLX,BARY,GRX-GLX,GY-BARY);
}
function drawReticle(now){
  if(!S||!["announce","countdown","shoot"].includes(S.phase)) return;
  cx.font=`700 ${Math.max(12,0.3*sc(M.DG))}px ${FCND}`;
  cx.textAlign="center"; cx.fillStyle="rgba(200,220,235,.6)";
  for(const z of ["L","C","R"]) cx.fillText(z,PXX(Z2X(z),M.DG),BARY-0.2*sc(M.DG));
  const ax=PXX(Z2X(S.aimLive||"C"),M.DG), ay=gy(M.DG)-1.15*sc(M.DG);
  const pulse=1+0.08*Math.sin(now/(S.phase==="announce"?170:110));
  const R=0.52*sc(M.DG)*pulse;
  cx.save();
  cx.strokeStyle="rgba(255,196,0,.9)"; cx.lineWidth=Math.max(2,H*0.0032);
  cx.shadowColor="rgba(255,196,0,.8)"; cx.shadowBlur=12;
  cx.beginPath(); cx.arc(ax,ay,R,0,7); cx.stroke();
  cx.globalAlpha=0.55;
  cx.beginPath(); cx.arc(ax,ay,R*0.55,0,7); cx.stroke();
  cx.globalAlpha=1;
  cx.beginPath();
  cx.moveTo(ax-R*1.45,ay); cx.lineTo(ax-R*0.75,ay);
  cx.moveTo(ax+R*0.75,ay); cx.lineTo(ax+R*1.45,ay);
  cx.moveTo(ax,ay-R*1.45); cx.lineTo(ax,ay-R*0.75);
  cx.moveTo(ax,ay+R*0.75); cx.lineTo(ax,ay+R*1.45);
  cx.stroke();
  cx.fillStyle="rgba(255,196,0,.95)";
  cx.beginPath(); cx.arc(ax,ay,Math.max(2,H*0.003),0,7); cx.fill();
  cx.restore();
}

/* ============================== front FX ============================== */
function drawFX(now,dt){
  for(let i=FX.rings.length-1;i>=0;i--){               // post-clang rings
    const g=FX.rings[i], t=(now-g.t0)/380;
    if(t>1){ FX.rings.splice(i,1); continue; }
    cx.strokeStyle=`rgba(255,255,255,${0.8*(1-t)})`;
    cx.lineWidth=Math.max(1.5,H*0.004*(1-t));
    cx.beginPath(); cx.arc(g.x,g.y,(6+56*t)*H/900,0,7); cx.stroke();
  }
  for(let i=FX.confetti.length-1;i>=0;i--){
    const p=FX.confetti[i], age=(now-p.t0)/1000;
    if(age>4.5||p.y>H+20){ FX.confetti.splice(i,1); continue; }
    p.vy=Math.min(p.vy+H*0.55*dt,H*0.30);                 // gravity with flutter terminal speed
    p.x+=p.vx*dt+Math.sin(now/150+p.seed*7)*H*0.25*dt;
    p.y+=p.vy*dt;
    p.vx*=(1-0.4*dt); p.rot+=p.vr*dt;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.fillStyle=p.col; cx.globalAlpha=clamp(1.5-age/3,0,1);
    cx.fillRect(-2.6*H/900,-4.2*H/900,5.2*H/900,8.4*H/900);
    cx.restore(); cx.globalAlpha=1;
  }
}

/* ============================== scene events ============================== */
function sceneOnState(st,p){
  if(p?.phase===st.phase) return;
  switch(st.phase){
    case "lobby":
      ballReset(); dive=null; strikerReset(); poseKick=-1; FX.flashRate=1.2; FX.confetti.length=0;
      HERO.img=null; HERO.kick=-1;
      rampAmb(0.045,1.2); break;
    case "announce":
      ballRollIn(); dive=null; strikerReset(); poseKick=-1; FX.flashRate=4; rampAmb(0.06,1); break;
    case "countdown":
      FX.flashRate=6; rampAmb(0.075,1); break;
    case "shoot":
      FX.flashRate=2; sfxWhistle(); rampAmb(0.035,0.3); break;   // stadium holds its breath
    case "resolve":
      FX.flashRate=3; break;                                     // ball + dive set by shoot()
    case "end":{
      FX.flashRate=10; dive=null;
      const won=st.score>st.kicksTotal/2;
      if(won){ celebrate(null,6000); burstConfetti(220); sfxCheer(true); FX.flashBurst=performance.now()+2500; }
      else{ celebrate(cyanCol,5000); sfxCheer(false); }
      rampAmb(0.085,0.5); break;}
  }
}

/* ============================== main loop ============================== */
let lastT=0;
function draw(now){
  requestAnimationFrame(draw);
  if(!W) return;
  const dt=clamp((now-lastT)/1000||0.016,0.001,0.05); lastT=now;
  updateCrowd(now,dt); updateBall(now,dt);
  cx.save();
  const sh=shakeOff(now); cx.translate(sh[0],sh[1]);
  if(PHOTO.stadium){
    // Photoreal stadium plate as the base; procedural crowd FX still draw over it.
    coverDraw(PHOTO.stadium,0,0,W,H);
    // Soften the lower pitch so grass markings / ball read cleanly.
    cx.fillStyle="rgba(8,28,18,.28)"; cx.fillRect(0,H*0.55,W,H*0.45);
  } else {
    cx.drawImage(LBG,0,0);
  }
  drawCrowd(now);
  drawBoards(now);
  if(!PHOTO.stadium) cx.drawImage(LPITCH,0,0);
  else {
    // Light pitch overlay (markings + grass tint) without wiping the photo.
    cx.globalAlpha=0.55; cx.drawImage(LPITCH,0,0); cx.globalAlpha=1;
  }
  drawGoalShadow();
  drawNet(now);
  if(B.d>M.DG+0.05) drawBall();          // ball inside the goal sits behind the frame
  drawFrame(now);
  drawKeeper(now,dt);
  if(B.d>M.DSPOT+0.2 && B.d<=M.DG+0.05){ drawFlightGuide(); drawBall(); }
  drawStriker(now,dt);                   // taker at the spot — nearer than flight path
  if(B.d<=M.DSPOT+0.2){ drawFlightGuide(); drawBall(); }
  drawReticle(now);                      // aim HUD floats over the scene
  drawFX(now,dt);
  cx.restore();
  cx.drawImage(LVIG,0,0);
  drawPostFX(now);
  if(S?.phase==="resolve" && S.replay?.frames?.length>1) drawReplay(now);
  else replayKick=-1;
}

/* ============ bullet-time: orbiting slow-mo 3D skeleton ============ */
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],
             [23,24],[23,25],[25,27],[27,31],[24,26],[26,28],[28,32]];
let replayKick=-1, replayT0=0;
function drawReplay(now){
  const fr=S.replay.frames;
  if(S.replay.kick!==replayKick){ replayKick=S.replay.kick; replayT0=now; }
  const span=fr[fr.length-1].t-fr[0].t || 1;
  const SLOWMO=3.5;
  const playT=fr[0].t+((now-replayT0)%(span*SLOWMO))/SLOWMO;
  let f=fr[0];
  for(const g of fr){ if(g.t<=playT) f=g; else break; }

  const R=Math.min(W,H)*0.17, px=Math.max(R+W*0.015,W*0.145), py=H*0.52;
  cx.save();
  cx.fillStyle="rgba(5,13,21,.82)";
  cx.beginPath(); cx.roundRect(px-R,py-R*1.18,R*2,R*2.4,H*0.016); cx.fill();
  cx.strokeStyle="rgba(62,199,244,.5)"; cx.lineWidth=Math.max(1.5,H*0.0018); cx.stroke();

  // Neural / procedural depth plate — 2.5D parallax under the skeleton.
  if(HERO.img && HERO.kick===S.kick){
    const parallax=Math.sin((now-replayT0)/900)*R*0.06;
    cx.save();
    cx.beginPath(); cx.roundRect(px-R+4,py-R*1.05,R*2-8,R*2.05,H*0.012); cx.clip();
    cx.globalAlpha=0.72;
    cx.drawImage(HERO.img, px-R+4+parallax, py-R*1.05, R*2-8, R*2.05);
    cx.globalAlpha=1;
    cx.restore();
  }

  // REPLAY tab
  const tw=R*0.9, th=Math.max(18,H*0.03);
  cx.fillStyle="#FF4438";
  cx.beginPath(); cx.roundRect(px-R,py-R*1.18-th*0.55,tw,th,[H*0.008,H*0.008,0,0]); cx.fill();
  cx.fillStyle="#fff"; cx.font=`900 ${th*0.55}px ${FBLK}`; cx.textAlign="center";
  cx.fillText("REPLAY",px-R+tw/2,py-R*1.18+th*0.14);
  if(Math.sin(now/300)>0){ cx.fillStyle="#fff";
    cx.beginPath(); cx.arc(px-R+tw*0.09,py-R*1.18-th*0.05,th*0.14,0,7); cx.fill(); }
  cx.font=`800 ${Math.max(10,H*0.017)}px ${FCND}`;
  cx.fillStyle="#3EC7F4";
  const heroTag=HERO.img&&HERO.kick===S.kick
    ?(HERO.backend==="qnn"?"NEURAL FX · QNN":HERO.backend==="cpu"?"NEURAL FX · CPU":"NEURAL FX · ON-DEVICE")
    :"BULLET TIME · ON-DEVICE 3D";
  cx.fillText(heroTag,px,py-R*1.18+Math.max(16,H*0.028));
  if(S.last?.force){ cx.fillStyle="#FFC400";
    cx.font=`900 ${Math.max(12,H*0.022)}px ${FCND}`;
    cx.fillText(`${S.last.force} N`,px,py+R*1.16); }

  const th3=(now-replayT0)/1400, f3=R*1.4, dd=2.6;
  const proj=q=>{
    const x=q[0]*Math.cos(th3)-q[2]*Math.sin(th3);
    const z=q[0]*Math.sin(th3)+q[2]*Math.cos(th3);
    const s=f3/(z+dd);
    return [px+x*s, py+q[1]*s];
  };
  cx.strokeStyle="#3EC7F4"; cx.lineWidth=Math.max(2,H*0.0033); cx.lineCap="round";
  cx.shadowColor="#3EC7F4"; cx.shadowBlur=8;
  for(const [a,b] of BONES){
    if(!f.p[a]||!f.p[b]) continue;
    const [ax,ay]=proj(f.p[a]), [bx,by]=proj(f.p[b]);
    cx.beginPath(); cx.moveTo(ax,ay); cx.lineTo(bx,by); cx.stroke();
  }
  cx.shadowBlur=0;
  cx.fillStyle="#F4F7F1";
  if(f.p[0]){ const [hx,hy]=proj(f.p[0]);
    cx.beginPath(); cx.arc(hx,hy,Math.max(4,H*0.008),0,7); cx.fill(); }
  cx.fillStyle="#FFC400";
  for(const i of [31,32]){ if(!f.p[i]) continue;
    const [fx,fy]=proj(f.p[i]);
    cx.beginPath(); cx.arc(fx,fy,Math.max(3,H*0.006),0,7); cx.fill(); }
  cx.restore();
}

rebuild();
requestAnimationFrame(draw);
connect();
</script>
