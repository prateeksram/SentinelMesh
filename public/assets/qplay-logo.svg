  <!-- Wordmark -->
  <text x="122" y="82" font-family="'Arial Black','Archivo Black',Impact,'Segoe UI Black',sans-serif"
        font-size="64" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#3253DC">Q</tspan><tspan fill="#F4F7F1">Play</tspan>
  </text>
</svg>
